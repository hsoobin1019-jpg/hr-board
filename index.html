 '정기 면담':{q:['요즘 시간이 가장 많이 드는 업무는?','최근 성과 중 인정받고 싶은 일은?','업무량이나 근무시간이 부담되나요?','앞으로 맡고 싶은 일, 배우고 싶은 것은?','회사·팀에 바라는 점은?'],n:['평가가 아니라 듣는 자리라는 걸 먼저 알려 주세요','약속한 후속 조치는 기한과 함께 남겨 두세요']},
 '고충 면담':{q:['언제부터 어떤 일이 있었는지 순서대로 말씀해 주세요','관련된 사람·장소·목격자가 있나요?','지금 가장 바라는 조치는 무엇인가요?','업무 공간 분리처럼 당장 필요한 보호 조치가 있나요?'],n:['비밀 유지를 약속하고 지켜 주세요','직장 내 괴롭힘·성희롱은 사실 확인 조사와 피해자 보호 조치 의무가 있어요','느낌보다 사실 위주로 기록하세요']},
 '퇴사 면담':{q:['퇴사를 결심한 가장 큰 이유는?','회사가 무엇을 바꿨다면 남았을까요?','인수인계 대상과 일정은?','마지막 근무일과 남은 연차 사용 계획은?','다음 계획을 말해 줄 수 있나요? (선택)'],n:['사직서 제출일·퇴사일을 확정해 남겨 두세요','연차 정산 · 퇴직금(퇴직 후 14일 이내) · 4대보험 상실신고 일정을 안내하세요','퇴사 사유를 분류해 두면 이직 통계에 쓰여요']},
 '기타 면담':{q:['오늘 면담의 목적을 먼저 공유해 주세요','현재 상황을 어떻게 보고 있나요?','필요한 지원은 무엇인가요?'],n:['합의한 내용과 다음 일정을 남겨 두세요']}
};
function vTalk(){
  const tab=st.tkt||'log';
  return `<div class="ph"><h1>면담</h1><span class="sp"></span><button class="btn pri" data-act="newTalk">+ 면담 기록</button><div class="desc">면담 내용과 후속 조치를 남겨요. 기록을 쓸 때 유형별 질문을 눌러 바로 넣을 수 있어요.</div></div>
   <div class="segs ptabs">${[['log','면담 기록'],['guide','면담 가이드']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="tkt" data-v="${k}">${l}${k==='log'?`<span class="tc">${st.talks.size}</span>`:''}</button>`).join('')}</div>
   ${tab==='guide'?vTalkGuide():vTalkLog()}`;
}
function vTalkLog(){
  const q=(st.tq||'').toLowerCase(),ft=st.tft||'';
  const L=[...st.talks.values()].filter(t=>(!ft||t.type===ft)&&(!q||[t.name,t.team,t.summary,t.follow].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<section class="card rec"><div class="recbar"><input class="fsearch" id="tkQ" placeholder="이름 · 내용 검색" value="${esc(st.tq||'')}"><div class="segs">${['',...TALK_TYPES].map(x=>`<button class="${ft===x?'on':''}" data-act="tft" data-v="${x}">${x?x.replace(' 면담',''):'전체'}</button>`).join('')}</div><span class="sp" style="flex:1"></span><span class="note">${L.length}건</span></div>
   ${L.length?`<div class="rtw"><table class="rtab"><thead><tr><th>날짜</th><th>대상</th><th>부서</th><th>유형</th><th>내용</th><th>후속 조치</th><th class="c">조치 완료</th></tr></thead><tbody>
   ${L.map(t=>`<tr><td class="dt" data-talk="${t.id}">${md(t.date)} <span>${dow(t.date)}</span></td><td class="nm" data-talk="${t.id}"><b>${esc(t.name)}</b></td><td>${esc(t.team||'—')}</td><td><span class="cc t-s">${esc(t.type||'')}</span></td>
     <td class="mm2" title="${esc(t.summary||'')}">${esc((t.summary||'').replace(/\n/g,' ').slice(0,40))}</td><td class="mm2">${esc(t.follow||'—')}</td><td class="c">${t.follow?mkb('talks',t.id,'fdone',t.fdone,t.fdoneAt):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">면담 기록이 없어요.</div>'}</section>`;
}
function vTalkGuide(){
  return `<div class="tguide">${TALK_TYPES.map(k=>`<section class="card"><div class="card-h"><h2>${k}</h2><span class="sp"></span><button class="btn sm" data-act="newTalk" data-type="${k}">이 유형으로 기록</button></div>
    <h4 class="tgh">이렇게 물어보세요</h4><ol class="tgq">${TALK_GUIDE[k].q.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <h4 class="tgh">챙길 점</h4><ul class="tgn">${TALK_GUIDE[k].n.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>`;
}
function openTalk(id,pre={}){
  const t=id?st.talks.get(id):{date:today(),name:'',team:'',type:'정기 면담',summary:'',follow:'',...pre};if(!t)return;
  const names=staffOn().map(s=>s.name);
  openLayer(`<div class="modal wide" role="dialog" aria-label="면담"><h2>${id?'면담 기록':'면담 기록 쓰기'}</h2><form id="fTalk" data-id="${id||''}">
   <div class="g3"><div class="fld"><label for="kDate">날짜</label><input class="inp" type="date" id="kDate" value="${t.date||''}"></div>
    <div class="fld"><label for="kName">대상</label><input class="inp" id="kName" list="staffNames" value="${esc(t.name||'')}"><datalist id="staffNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="fld"><label for="kTeam">부서</label><input class="inp" id="kTeam" value="${esc(t.team||'')}"></div></div>
   <div class="fld"><label>유형</label><div class="segs pick" id="kType">${TALK_TYPES.map(x=>`<button type="button" class="${x===t.type?'on':''}" data-v="${x}">${x}</button>`).join('')}</div></div>
   <div class="fld"><label>질문 가이드 <span class="note">눌러서 내용에 넣기</span></label><div class="tqs" id="kQs">${TALK_GUIDE[t.type]?.q.map(x=>`<button type="button" class="chip" data-tq="${esc(x)}">${esc(x)}</button>`).join('')||''}</div></div>
   <div class="fld"><label for="kSum">내용</label><textarea class="inp" id="kSum" rows="6">${esc(t.summary||'')}</textarea></div>
   <div class="fld"><label for="kFollow">후속 조치</label><input class="inp" id="kFollow" value="${esc(t.follow||'')}" placeholder="예) 12/1까지 업무 분장 조정"></div></form>
   <div class="acts">${id?`<button class="btn dan" data-act="delTalk" data-id="${id}" style="margin-right:auto">삭제</button>`:''}<button class="btn" data-act="closeLayer">취소</button><button class="btn pri" data-act="saveTalk">저장</button></div></div>`);
}
async function saveTalkForm(){
  const id=$('#fTalk').dataset.id,d={date:$('#kDate').value,name:$('#kName').value.trim(),team:$('#kTeam').value.trim(),type:$('#kType .on')?.dataset.v||'기타 면담',summary:$('#kSum').value,follow:$('#kFollow').value.trim(),updatedAt:nowISO()};
  if(!d.name){toast('대상을 적어 주세요');return}
  if(!d.team){const s=staffOn().find(x=>x.name===d.name);if(s)d.team=s.team||''}
  await st.api.put('talks',id||'k-'+uid(),id?d:{...d,createdAt:nowISO()});addLog(`면담 기록 · ${d.name} (${d.type})`);closeLayer();toast('저장했어요');
}

/* ---------------- 일학습 · 인턴 (P-TECH · 도제 · 대학생인턴) ---------------- */
const TRN_PROGS=['P-TECH','도제','대학생인턴','기타'];
const isIntern=t=>t.prog==='대학생인턴';
const trnCls=p=>({'P-TECH':'t-b','도제':'t-g','대학생인턴':'t-a'}[p]||'t-s');
/* 상태: 수료·중도 종료는 직접 정하고, 나머지는 기간으로 계산 (예정 → 진행 중 → 기간 끝남) */
const trnState=t=>{if(t.status==='수료'||t.status==='중도 종료')return t.status;const td=today();if(t.start&&td<t.start)return '예정';if(t.end&&td>t.end)return '기간 끝남';return '진행 중'};
const trnOpen=t=>['예정','진행 중','기간 끝남'].includes(trnState(t))||(isIntern(t)&&!t.dec&&t.status!=='중도 종료');
/* 대학생인턴: 끝나기 14일 전부터 채용 여부를 정하라고 띄워요 */
const trnNeedDec=t=>isIntern(t)&&!t.dec&&t.status!=='중도 종료'&&!!t.end&&diffD(t.end,today())<=14;
const trnAll=()=>[...(st.trainees?.values()||[])];
const trnSpan=t=>t.start||t.end?`${(t.start||'').replace(/-/g,'.')} ~ ${(t.end||'').replace(/-/g,'.')}`:'—';
const trnPct=t=>{if(!t.start||!t.end)return null;const a=diffD(today(),t.start),n=diffD(t.end,t.start);return n>0?Math.max(0,Math.min(100,Math.round(a/n*100))):null};
function vTrnList(){
  const td=today(),A=trnAll(),fp=st.trnP||'',fs=st.trnS||'open',q=(st.trnQ||'').toLowerCase();
  const L=A.filter(t=>(!fp||t.prog===fp)&&(fs==='all'||(fs==='open'?trnOpen(t):!trnOpen(t)))&&(!q||[t.name,t.team,t.school,t.major,t.prof,t.fieldProf,t.hrd,t.memo].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(trnNeedDec(b)-trnNeedDec(a))||TRN_PROGS.indexOf(a.prog)-TRN_PROGS.indexOf(b.prog)||(a.end||'9').localeCompare(b.end||'9')||(a.name||'').localeCompare(b.name||''));
  const on=A.filter(t=>trnState(t)==='진행 중'),dec=A.filter(trnNeedDec),soon=A.filter(t=>trnState(t)==='진행 중'&&t.end&&diffD(t.end,td)<=30);
  const hired=A.filter(t=>isIntern(t)&&t.dec==='채용').length,decided=A.filter(t=>isIntern(t)&&t.dec).length;
  const KP=[['진행 중',on.length+'명',`예정 ${A.filter(t=>trnState(t)==='예정').length}명`],['P-TECH',on.filter(t=>t.prog==='P-TECH').length+'명','일학습병행 진행 중'],['도제',on.filter(t=>t.prog==='도제').length+'명','진행 중'],['대학생인턴',on.filter(t=>isIntern(t)).length+'명',`채용 전환 ${hired}/${decided||0}`],['30일 안 종료',soon.length+'명','수료 · 평가 준비'],['채용 결정 대기',dec.length+'명','대학생인턴 종료 14일 전부터']];
  const cell=v=>v?esc(v):'<span class="na">—</span>';
  const stCell=t=>{const s=trnState(t);
    if(isIntern(t)){if(t.dec)return `<span class="cc ${t.dec==='채용'?'t-g':'t-s'}">${t.dec==='채용'?'채용 전환':'미채용'}</span>`;
      if(trnNeedDec(t))return `<div class="trk">${['채용','미채용'].map(o=>`<button class="mkb" data-act="trnDec" data-id="${t.id}" data-v="${o}">${o}</button>`).join('')}</div>`}
    return `<span class="cc ${s==='진행 중'?'t-c':s==='예정'?'t-b':s==='기간 끝남'?'t-a':s==='수료'?'t-g':'t-r'}">${s}</span>`};
  const dd=t=>{if(!t.end||!trnOpen(t))return '<span class="na">—</span>';const n=diffD(t.end,td);return `<span class="dday ${n<0?'over':n<=30?'soon':''}">${dfmt(n)}</span>`};
  return `
   <div class="kpis">${KP.map(([l,v,s])=>`<div class="kp"><span>${l}</span><b>${v}</b><small>${s}</small></div>`).join('')}</div>
   <section class="card rec"><div class="recbar"><input class="fsearch" id="trnQ" placeholder="이름 · 학교 · 교수 검색" value="${esc(st.trnQ||'')}">
     <div class="segs">${['',...TRN_PROGS].map(x=>`<button class="${fp===x?'on':''}" data-act="trnP" data-v="${x}">${x||'전체'}<span class="tc">${A.filter(t=>(!x||t.prog===x)&&(fs==='all'||(fs==='open'?trnOpen(t):!trnOpen(t)))).length}</span></button>`).join('')}</div>
     <div class="segs">${[['open','진행 · 예정'],['done','끝남'],['all','전체']].map(([k,l])=>`<button class="${fs===k?'on':''}" data-act="trnS" data-v="${k}">${l}</button>`).join('')}</div>
     <span class="sp" style="flex:1"></span><span class="note">${L.length}명</span></div>
   ${L.length?`<div class="rtw"><table class="rtab trn"><thead><tr><th>과정</th><th>이름</th><th>부서</th><th>학교 · 학과</th><th>담당교수</th><th>현장교수 · 교사</th><th>HRD 담당자</th><th>기간</th><th>남은 기간</th><th>상태 · 채용</th><th>메모</th></tr></thead><tbody>
   ${L.map(t=>{const pc=trnPct(t);return `<tr class="${trnNeedDec(t)?'hl':''}"><td><span class="cc ${trnCls(t.prog)}">${esc(t.prog||'기타')}</span></td><td class="nm" data-trn="${t.id}"><b>${esc(t.name)}</b>${t.grade?`<small>${esc(t.grade)}</small>`:''}</td><td>${cell(t.team)}</td>
     <td>${t.school?`${esc(t.school)}${t.major?`<small class="sub">${esc(t.major)}</small>`:''}`:'<span class="na">—</span>'}</td><td>${cell(t.prof)}</td>
     <td>${isIntern(t)?'<span class="na" title="대학생인턴은 해당 없음">해당 없음</span>':cell(t.fieldProf)}</td><td>${isIntern(t)?'<span class="na" title="대학생인턴은 해당 없음">해당 없음</span>':cell(t.hrd)}</td>
     <td class="trnp">${trnSpan(t)}${pc!=null&&trnState(t)==='진행 중'?`<div class="pbar" title="${pc}% 지남"><i style="width:${pc}%"></i></div>`:''}${t.grad?`<small class="sub">졸업 ${t.grad.replace(/-/g,'.')}</small>`:''}</td>
     <td>${dd(t)}</td><td>${stCell(t)}</td><td class="mm2" title="${esc(t.memo||'')}">${esc((t.memo||'').replace(/\n/g,' ').slice(0,30))||'<span class="na">—</span>'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">${A.length?'조건에 맞는 사람이 없어요.':'아직 등록한 사람이 없어요. + 등록이나 붙여넣기로 넣어 주세요.'}</div>`}
   </section>`;
}

    <div class="fld"><label for="nHrd">HRD 담당자</label><input class="inp" id="nHrd" value="${esc(t.hrd||'')}" placeholder="이름 · 소속 · 연락처"></div></div>

   <div class="fld"><label>진행 상태 <span class="note">비워 두면 기간으로 계산해요</span></label><div class="segs pick" id="nStatus">${[['','자동'],['수료','수료'],['중도 종료','중도 종료']].map(([v,l])=>`<button type="button" class="${(t.status||'')===v?'on':''}" data-v="${v}">${l}</button>`).join('')}</div></div>

async function eduIngest(recs,src){
  const A=eduAll(),ops=[],miss=new Set();let skip=0;
  recs.forEach(r=>{const s=(r.empNo&&staffAll().find(x=>x.empNo===r.empNo))||staffOn().find(x=>x.name===r.name)||staffAll().find(x=>x.name===r.name);if(!s)miss.add(r.name);
    const seen=e=>[e,...(e.hist||[])];if((r.srcId&&A.some(e=>seen(e).some(h=>h.srcId===r.srcId)))||A.some(e=>(e.sid===s?.id||e.name===r.name)&&seen(e).some(h=>(h.start||'')===(r.start||'')&&eduKey(h.title)===eduKey(r.title)))){skip++;return}
    ops.push({c:'edu',id:'d-'+uid(),d:{sid:s?.id||'',empNo:s?.empNo||r.empNo||'',name:s?.name||r.name,title:r.title,kind:r.kind||'',start:r.start||'',end:r.end||'',org:r.org||'',hours:r.hours||'',note:r.note||'',docNo:r.docNo||'',fee:r.fee||'',place:r.place||'',src,srcId:r.srcId||'',createdAt:nowISO()}})});

const photo34=src=>new Promise(ok=>{const im=new Image();im.onload=()=>{try{const W=300,H=400,r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(im,(W-w)/2,(H-h)/2,w,h);ok(cv.toDataURL('image/jpeg',.9))}catch(e){ok(src)}};im.onerror=()=>ok('');im.src=src});

/* Word: 사진까지 담으려고 '웹 보관 파일(MHT)' 형식으로 저장해요 (.doc 로 열려요) */
const b64utf8=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(r)};
const wrap76=s=>s.replace(/(.{76})/g,'$1\r\n');
function wordMht(items){
  const imgs=[];let n=0;
  const body=items.map(x=>x.html.replace(/src="(data:image\/(\w+);base64,([^"]+))"/g,(m,_,t,d)=>{const nm=`image${++n}.${t==='jpeg'?'jpg':t}`;imgs.push({nm,t,d});return `src="hrcard_files/${nm}"`})).join(`<br clear="all" style="page-break-before:always;mso-break-type:page-break">`);
  const css=CARD_CSS.replace(/@page\{[^}]*\}/,'@page Section1{size:595.3pt 841.9pt;margin:34pt 34pt 34pt 34pt;mso-header-margin:20pt;mso-footer-margin:20pt}div.Section1{page:Section1}').replace(/\.pg\{[^}]*\}\.pg:last-child\{[^}]*\}/,'');
  const html=`<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>${css}</style></head><body><div class="Section1">${body}</div></body></html>`;
  const B='----=_NextPart_HRCARD_'+Date.now(),L='file:///C:/hrcard/';
  let m=`MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: ${L}hrcard.htm\r\n\r\n${wrap76(b64utf8(html))}\r\n`;
  imgs.forEach(i=>{m+=`\r\n--${B}\r\nContent-Type: image/${i.t}\r\nContent-Transfer-Encoding: base64\r\nContent-Location: ${L}hrcard_files/${i.nm}\r\n\r\n${wrap76(i.d)}\r\n`});
  return m+`\r\n--${B}--\r\n`;
}
