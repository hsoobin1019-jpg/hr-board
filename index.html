<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR 업무 보드 · Subin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --line2:#f0f1f4;
  --ink:#1d2129; --ink2:#4a505b; --mute:#8b919c;
  --pri:#1f6fe5; --pri-soft:#eaf2fe; --blue:#1f6fe5; --blue-soft:#eaf2fe;
  --red:#e5484d; --red-soft:#fdecec; --orange:#ee8a1b; --orange-soft:#fff3e2; --green:#16a34a; --green-soft:#e8f7ee;
  --navy:#1d2129; --brand-red:#e3262e;
  --tile:#f7f8fa; --r:14px;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}

/* ---------- login ---------- */
#gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);width:100%;max-width:420px;padding:40px 36px}
.gcard .logo{margin-bottom:28px}
.gcard h1{font-size:22px;margin:0 0 6px}
.gcard p.sub{color:var(--mute);margin:0 0 24px;font-size:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13px;font-weight:600;color:var(--ink2)}
.inp{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none;width:100%}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
select.inp{padding-right:30px}
.gerr{color:var(--red);font-size:13px;min-height:20px;margin:4px 0 8px}
.glinks{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.glinks button{background:none;border:0;color:var(--pri);padding:0;font-weight:600}

/* ---------- buttons ---------- */
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f7f8fb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn.dan{color:var(--red)}
.btn.big{height:48px;width:100%;justify-content:center;font-size:15px}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:0;background:none;display:inline-grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:#f1f2f6}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px 0 20px;gap:22px}
.ghb{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none}
.ghb::before{content:'';width:8px;height:8px;border-radius:50%;background:#16a34a}
.ghb.wait::before,.ghb.busy::before{background:#f59e0b}.ghb.err::before{background:#e5484d}.ghb.offline::before{background:#9aa1ad}
.ghb.err{color:#c4232a;border-color:#f3c2c4}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);font-size:22px;letter-spacing:-.3px;white-space:nowrap}
.logo svg{flex:none}
.logo .co{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:4px}
.search{flex:1;max-width:520px;position:relative;margin-left:30px}
.search input{width:100%;height:44px;border:0;background:transparent;padding-left:38px;font-size:16px;outline:none}
.search input::placeholder{color:#a3a8b1}
.search .mg{position:absolute;left:6px;top:11px;color:#6b7280}
.sres{position:absolute;top:50px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(20,24,40,.14);padding:8px;max-height:420px;overflow:auto}
.sres .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.sres .it:hover{background:#f5f6f9}
.sres .gh{font-size:12px;color:var(--mute);padding:8px 12px 4px;font-weight:600}
.me{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:16px;color:var(--ink2);white-space:nowrap}
.shell{display:flex;min-height:calc(100% - 76px)}
.side{width:268px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px 30px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}
.nav-q{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:16px}
.nav-q .ic{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(20,24,40,.12);display:grid;place-items:center}
.nav-sep{height:1px;background:var(--line);margin:14px 6px}
.nav a{display:flex;align-items:center;gap:16px;height:52px;padding:0 14px;border-radius:12px;font-size:16px;color:#2b2f36;position:relative}
.nav a svg{color:#3a3f48;flex:none}
.nav a:hover{background:#f6f7fa}
.nav a.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.nav a.on svg{color:var(--pri)}
.nav a .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.main{flex:1;min-width:0;padding:38px 38px 120px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.4px}
.ph .sp{flex:1}
.ph .desc{color:var(--mute);font-size:14px;width:100%;margin-top:-4px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 30px;margin-bottom:28px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.card-h h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px}
.card-h .sp{flex:1}
.card.fold .card-b{display:none}
.card.fold .card-h{margin-bottom:0}
.grid-home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 32px;align-items:start}
.banner{border-radius:var(--r);padding:34px 36px;color:#fff;position:relative;overflow:hidden;margin-bottom:28px;min-height:230px}
.banner h3{font-size:28px;line-height:1.45;margin:0;font-weight:800;letter-spacing:-.5px;position:relative;z-index:1;max-width:460px}
.banner p{margin:12px 0 0;opacity:.92;font-size:16px;position:relative;z-index:1}
.banner .bact{position:relative;z-index:1;margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.banner .bact button{height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.22);color:#fff;font-weight:700;padding:0 18px}
.banner .bact button:hover{background:rgba(255,255,255,.32)}
.b1{background:#fff}
.b2{background:#f0a500}
.banner .art{position:absolute;right:28px;bottom:-6px;opacity:.95}
.wkbar{height:10px;border-radius:5px;background:rgba(255,255,255,.3);margin-top:16px;max-width:420px;position:relative;z-index:1;overflow:hidden}
.wkbar i{display:block;height:100%;background:#fff;border-radius:5px}

.team{display:grid;grid-template-columns:200px 1fr;gap:0}
.team .lead{text-align:center;border-right:1px dashed var(--line);padding-right:24px}
.team .lead .lb{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:14px}
.team .lead .big{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:var(--c,#1f6fe5)}
.team .lead b{display:block;font-size:17px}
.team .lead small{color:var(--ink2);font-size:14px}
.team .mem{padding-left:24px}
.org{display:flex;border:1px solid var(--line);border-radius:4px;height:40px;align-items:center;margin-bottom:18px}
.org span{padding:0 14px;border-right:1px solid var(--line);height:100%;display:grid;place-items:center;background:#fafbfc;font-weight:600}
.org b{padding:0 14px;font-weight:500}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px}
.mrow.h{border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:4px;color:var(--pri);font-weight:600;font-size:17px}
.mrow.h b{margin-left:auto;font-size:26px;text-decoration:underline;text-underline-offset:4px}
.mrow .n{margin-left:auto;display:flex;gap:12px;font-size:13px;color:var(--mute)}
.mrow .n b{color:var(--ink);font-weight:700}
.mrow .n .lt b{color:var(--red)}
.mrow{cursor:pointer;border-radius:8px}
.mrow:not(.h):hover{background:#fafbfd}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{background:var(--tile);border-radius:12px;padding:24px 10px;text-align:center;cursor:pointer;border:0;width:100%}
.tile:hover{background:#eef0f5}
.tile .v{font-size:34px;font-weight:700;color:var(--blue);line-height:1.1}
.tile .l{font-weight:700;margin-top:10px;font-size:15px}
.tile.hot .v{color:var(--red)}
.tile.warm .v{color:var(--orange)}

/* ---------- list rows ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#fafbfd}
.row .tt{flex:1;min-width:0}
.row .tt b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt small{color:var(--mute);font-size:13px}
.row .dd{font-size:13px;color:var(--ink2);white-space:nowrap}
.row .dd.late{color:var(--red);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:30px 0;font-size:14px}
.segs{display:inline-flex;background:#f2f3f7;border-radius:10px;padding:3px}
.segs button{border:0;background:none;height:32px;padding:0 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2)}
.segs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- pills / avatars ---------- */
.av{width:28px;height:28px;border-radius:50%;background:var(--c,#9aa1ad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex:none;letter-spacing:-.3px}
.av.lg{width:36px;height:36px;font-size:13px}
.av.none{background:#fff;border:1.5px dashed #c5c9d1;color:#9aa1ad}
.who{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap;border:0}
.s-todo{background:#f1f2f5;color:#4a505b}
.s-doing{background:var(--blue-soft);color:var(--blue)}
.s-hold{background:var(--orange-soft);color:#b45f06}
.s-done{background:var(--green-soft);color:var(--green)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);background:#f4f5f8;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c,#9aa1ad)}
.tag.r{background:var(--pri-soft);color:var(--pri)}
.star{color:#d5d8de;border:0;background:none;font-size:18px;padding:0 4px;line-height:1}
.star.on{color:#f5b301}
.late-t{color:var(--red);font-weight:700}

/* ---------- task table ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.fbar .lb{font-size:13px;color:var(--mute);font-weight:600;margin-right:2px}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .av{width:20px;height:20px;font-size:9px}
.fsel{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-size:13px;font-weight:600}
.fsearch{height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:13px;min-width:200px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:13px;color:var(--mute);font-weight:600;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:#fafbfd}
.tbl tr.sel td{background:#eaf2fe}
.tbl .ck{width:36px}
.tbl input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri);cursor:pointer}
.tbl .ttl{font-weight:600;cursor:pointer}
.tbl .ttl:hover{color:var(--pri)}
.tbl .sub{font-size:12px;color:var(--mute);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cellbtn{border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;text-align:left}
.cellbtn:hover{background:#eef0f5}
.cellbtn .ph2{color:#a5aab3}
.helpers{display:inline-flex;margin-left:2px}
.helpers .av{width:22px;height:22px;font-size:9px;margin-left:-6px;border:2px solid #fff}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:40;background:#1d2129;color:#fff;border-radius:16px;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 34px rgba(0,0,0,.25);flex-wrap:wrap;max-width:calc(100% - 24px)}
.bulk b{margin-right:8px;white-space:nowrap}
.bulk button{height:36px;border-radius:9px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:600;padding:0 14px;font-size:13px}
.bulk button:hover{background:rgba(255,255,255,.22)}
.bulk button.x{background:none;color:#aeb4bf}

/* ---------- popover / drawer / modal ---------- */
.pop{position:fixed;z-index:80;background:#fff;border-radius:14px;box-shadow:0 14px 36px rgba(20,24,40,.18);padding:8px;min-width:200px;max-height:380px;overflow:auto}
.pop .pi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px;width:100%;border:0;background:none;text-align:left}
.pop .pi:hover{background:#f4f5f8}
.pop .pi.on{font-weight:700}
.pop .pi .ck2{margin-left:auto;color:var(--pri);font-weight:800}
.pop .ph3{font-size:12px;color:var(--mute);font-weight:600;padding:8px 10px 4px}
.pop .pbody{padding:6px 6px 4px;display:flex;flex-direction:column;gap:10px;min-width:260px}
.pop .pbody .r2{display:flex;gap:8px;align-items:center}
.pop .pbody .inp{height:40px}
.scrim{position:fixed;inset:0;background:rgba(17,20,26,.36);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:70;box-shadow:-10px 0 40px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer .dh h2{margin:0;font-size:19px;flex:1}
.drawer .db{flex:1;overflow:auto;padding:22px 24px}
.drawer .df{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sec{margin-top:22px}
.sec h4{margin:0 0 10px;font-size:14px;color:var(--ink2)}
.stbtns{display:flex;gap:6px;flex-wrap:wrap}
.stbtns .pill{cursor:pointer;opacity:.55;height:34px;padding:0 14px}
.stbtns .pill.on{opacity:1;box-shadow:inset 0 0 0 2px currentColor}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchips .chip{height:32px}
.hist{font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.hist .h1{display:flex;gap:8px}
.hist .h1 time{color:var(--mute);white-space:nowrap;font-size:12px;min-width:84px}
.cmt{background:#f7f8fa;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:8px}
.cmt .cm{font-size:12px;color:var(--mute);margin-bottom:3px}
.modal{position:fixed;z-index:75;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:26px 28px}
.modal h2{margin:0 0 18px;font-size:20px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d2129;color:#fff;padding:12px 14px 12px 20px;border-radius:14px;z-index:90;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:#8fc0ff;font-weight:700}
.note{font-size:13px;color:var(--mute)}

/* ---------- calendar ---------- */
.calh{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.calh h2{margin:0;font-size:22px;min-width:130px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .wd{font-size:13px;font-weight:600;color:var(--mute);padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafbfc}
.cal .d{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;cursor:pointer;overflow:hidden}
.cal .d:hover{background:#fbfbfd}
.cal .d.out{background:#fafafb}
.cal .d.out .dn{color:#c2c6cd}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--pri)}
.cal .dn{font-size:13px;font-weight:600;padding:2px 4px;display:flex;justify-content:space-between}
.cal .d.today .dn span{background:var(--pri);color:#fff;border-radius:11px;padding:0 7px}
.cal .d.off .dn span{color:var(--red)}
.cal .d.sat .dn span,.cal .wd.sat{color:#3D5BD9}
.cal .wd.sun{color:var(--red)}
.cal .d.out.sat .dn span,.cal .d.out.off .dn span{opacity:.4}
.cal .d.today.off .dn span,.cal .d.today.sat .dn span{color:#fff}
.cal .hn{font-size:11px;color:var(--red);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.ce{display:block;font-size:12px;border-radius:5px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#f1f2f5;color:#3a3f48;border-left:3px solid var(--c,#9aa1ad)}
.ce.done{opacity:.5;text-decoration:line-through}
.ce.late{background:var(--red-soft);color:#b42318}
.ce.in{background:#e8f0ff;border-left-color:var(--blue)}
.ce.out{background:var(--orange-soft);border-left-color:var(--orange)}
.ce.mid{opacity:.7}
.more{font-size:11px;color:var(--mute);margin-top:3px;padding-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- routines ---------- */
.ytbl{width:100%;border-collapse:collapse;table-layout:fixed}
.ytbl th{background:#fafbfc;font-size:14px;padding:10px 12px;border:1px solid var(--line);text-align:left}
.ytbl td{border:1px solid var(--line);vertical-align:top;padding:8px 10px;font-size:13.5px}
.ytbl td.m{font-weight:700;width:80px;text-align:center;vertical-align:middle;background:#fafbfc}
.ytbl tr.cur td.m{background:var(--pri-soft);color:var(--pri)}
.ri{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:8px;cursor:pointer}
.ri:hover{background:#f4f5f8}
.ri .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#c5c9d1);margin-top:7px;flex:none}
.ri .rt{flex:1;min-width:0}
.ri .rd{font-size:12px;color:var(--mute);white-space:nowrap}
.ri.off{opacity:.45}

.main{padding:34px 40px 120px}

.t-b{background:#eaf2fe;color:#1f6fe5}.t-c{background:#e2f6fb;color:#0e9fc0}.t-g{background:#e6f6ec;color:#169c55}.t-s{background:#eef1f5;color:#475569}.t-a{background:#fff3df;color:#d48300}.t-r{background:#fdecec;color:#e5484d}

.kdue.soon{background:#fff3df;color:#b86e00}
.kchk.all{background:var(--green);color:#fff;border-radius:6px;padding:1px 6px}
.kempty{font-size:12px;color:var(--mute);text-align:center;padding:16px 0;border:1.5px dashed #d3d9e2;border-radius:12px}
.kadd{margin-top:8px}
.kadd input{width:100%;border:0;background:none;border-radius:10px;height:36px;padding:0 10px;font-size:14px;color:var(--ink2);outline:none}
.kadd input:hover{background:#e3e8ef}
.kadd input:focus{background:#fff;box-shadow:0 0 0 2px var(--cyan)}
/* 체크리스트 */
.ckl{display:flex;align-items:center;gap:10px;padding:5px 2px;border-radius:8px}
.ckl:hover{background:#f8fafc}
.ckl span{flex:1}
.ckl.done span{color:var(--mute);text-decoration:line-through}
.ckl .icon-btn{width:26px;height:26px;opacity:.5}
/* 정기업무: 이번 달 · 년간 카드 */
.rsum{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:4px 2px 14px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.rsum b{font-size:17px;margin-right:6px}
.rsum .prog{margin:0}
.rchips{display:flex;gap:6px}
.ag{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.ag:last-child{border-bottom:0}
.agd{text-align:center;padding-top:3px}
.agd b{display:block;font-size:21px;line-height:1.1;font-weight:700}
.agd span{font-size:12px;color:var(--mute)}
.agd.off b{color:var(--red)}
.agd.today b,.agd.today span{color:var(--pri);font-weight:700}
.agl{display:flex;flex-direction:column;gap:2px}
.oc{display:flex;align-items:center;gap:12px;padding:6px 6px;border-radius:10px}
.oc:hover{background:#f8fafc}
.oc.miss{opacity:.55}
.ost{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;background:#f1f4f8;color:var(--ink2)}
.ost.s-done{background:var(--green-soft);color:var(--green)}.ost.s-late{background:var(--red-soft);color:var(--red)}.ost.s-doing{background:var(--pri-soft);color:var(--pri)}.ost.s-miss{color:var(--mute)}.ost.s-plan{background:#fff;border:1px dashed #cdd3dc;color:var(--mute)}
.agenda.dim{opacity:.8}
.ygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ym{border:1.5px solid var(--line2);border-radius:16px;padding:12px 10px 8px;background:#fff;min-height:120px}
.ym.cur{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.ym.past{background:#fafbfc}
.ym.past .yi{opacity:.55}
.ymh{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:0 2px}
.ymh b{font-size:16px}
.ymh .addln{margin-left:auto}
.yi{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.4}
.yi:hover{background:var(--surface)}
.yi.off{opacity:.4}
.yd{flex:none;font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:6px;padding:1px 6px;margin-top:1px;min-width:44px;text-align:center}
.yt{flex:1;min-width:0}
.lg-dot{color:var(--cyan);font-size:9px;vertical-align:middle}
.ymon{margin-top:14px;border:1.5px solid var(--line2);border-radius:16px;padding:12px}
.mstrip{display:flex;flex-wrap:wrap;gap:8px}
.mchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;display:inline-flex;align-items:center;gap:8px;text-align:left}
.mchip:hover{border-color:var(--cyan)}
.mchip .md{background:var(--cyan-soft);color:#0b88a6;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;flex:none}
.mchip.off{opacity:.45}
@media (max-width:1180px){.ygrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- 다우오피스 디자인 시스템 색감 (민트 + 시안·블루·라벤더 그라데이션, 검정 버튼) ---------- */
:root{
  --pri:#008197; --pri-soft:#EBF8FB; --blue:#008197; --blue-soft:#EBF8FB;
  --cyan:#00A1B9; --cyan-soft:#EBF8FB; --mint-100:#D0EFF6; --mint-200:#A8DEEB; --mint-700:#006B7E;
  --ink:#16232A; --ink2:#333333; --mute:#7C8A91; --line:#E4E9EB; --line2:#EEF2F3;
  --surface:#F7F9FA; --field:#F5F8F9; --r:24px;
  --red:#DC2626; --red-soft:#FFF0F0; --green:#16A34A; --green-soft:#E6FCF5; --orange:#F59E0B; --orange-soft:#FFF8E6;
  --grad:linear-gradient(90deg,#4CF1FF 0%,#0D99FF 50%,#B694FF 100%);
  --grad-line:linear-gradient(40deg,#da8fff 10%,#237fff 100%);
  --panel-sh:0 7px 21px rgba(0,0,0,.04); --hover-sh:0 10px 30px #e4edf0;
}
body{color:var(--ink)}
/* 로고: 그라데이션 마크 + 글자 */
.logo{gap:10px;font-size:20px;color:var(--ink)}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:inset 0 0 8px rgba(255,255,255,.3),0 0 16px rgba(13,153,255,.28);flex:none}
.logo .mk svg{display:block}
.logo .gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 상단 시안 띠 */
.pvbar{background:#333}
.pvbar b{background:var(--grad);color:#fff}
/* 버튼: 다우오피스처럼 주 버튼은 검정 알약, 보조는 선 */
.btn{border-radius:46px;border-color:#DCDEE3;color:#16232A}
.btn:hover{background:var(--field)}
.btn.pri{background:#333;border-color:#333;color:#fff}
.btn.pri:hover{background:#16232A;filter:none}
.btn.sm{border-radius:46px}
/* 입력칸 */
.inp,.fsel,.fsearch{background:var(--field);border-color:var(--line)}
.inp:focus,.fsel:focus,.fsearch:focus{background:#fff;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.search input{background:var(--field)}
.qadd{background:#fff;border-color:var(--line)}
.qadd:focus-within{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;box-shadow:0 0 0 4px #EBF8FB}
.qplus{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.qprev b{color:var(--pri)}
/* 메뉴 */
.nav a.on{background:var(--pri-soft);color:var(--mint-700)}
.nav a.on svg{color:var(--pri)}
.nav-q{background:var(--surface)}
.nav-q .ic{color:var(--cyan)}
/* 카드 · 패널 */
.card{background:var(--surface);border-radius:24px}
.panel{border-radius:20px;box-shadow:var(--panel-sh);border:1px solid #EEF2F3}
.hc.span2{background:var(--pri-soft)} /* 핵심 카드 한 장: 민트 틴트 */
.card-h h2{color:var(--ink)}
.hct svg{color:var(--pri)}
/* 홈 */
.hero h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.prog i,.wkc i{background:var(--grad)}
.wkc.on .d{color:var(--pri)}
.sg.hot{background:linear-gradient(#fff,#fff) padding-box,var(--grad-line) border-box}
.mini button:hover,.app:hover{border-color:var(--cyan);box-shadow:0 0 0 4px var(--pri-soft),var(--hover-sh)}
.app{border-radius:20px}
.ai{border-radius:16px;box-shadow:inset 0 0 12px rgba(255,255,255,.6),0 0 14px rgba(16,40,60,.08)}
/* 색 칩 (민트·블루·라벤더 계열 + 상태색) */
.t-b{background:linear-gradient(135deg,#E8F5FF,#D6ECFF);color:#0D7FE0}
.t-c{background:linear-gradient(135deg,#EBF8FB,#D0EFF6);color:#008197}
.t-g{background:linear-gradient(135deg,#E6FCF5,#CDF5E6);color:#12894A}
.t-a{background:linear-gradient(135deg,#FFF8E6,#FFEFC7);color:#B86E00}
.t-s{background:linear-gradient(135deg,#F5F8F9,#E9EEF0);color:#5F6E75}
.t-r{background:linear-gradient(135deg,#FFF0F0,#FFE0E0);color:#DC2626}
.cc.t-b,.cc.t-c,.cc.t-g,.cc.t-a,.cc.t-s,.cc.t-r{background-image:none}
.cc.t-b{background:#E6F3FF}.cc.t-c{background:#EBF8FB}.cc.t-g{background:#E6FCF5}.cc.t-a{background:#FFF8E6}.cc.t-s{background:#F0F3F5}.cc.t-r{background:#FFF0F0}
.kbar.t-b{background:#0D99FF}.kbar.t-c{background:#00A1B9}.kbar.t-g{background:#16A34A}.kbar.t-s{background:#A8B4BA}.kbar.t-a{background:#F59E0B}.kbar.t-r{background:#DC2626}
.tag.r{background:var(--mint-100);color:var(--mint-700)}
/* 상태 */
.s-doing{background:var(--pri-soft);color:var(--mint-700)}
.s-done{background:var(--green-soft);color:var(--green)}
.s-hold{background:var(--orange-soft);color:#B86E00}
.kdot.s-doing{background:var(--cyan)}
.tabs button.on .tc{background:var(--pri-soft);color:var(--mint-700)}
.chip.on{background:#333;border-color:#333}
.ckc:hover{border-color:var(--cyan);background:var(--pri-soft)}
/* 보드 */
.kcol{background:#EEF3F5}
.kcol.over{border-color:var(--cyan);background:var(--pri-soft)}
.kc{box-shadow:0 2px 6px rgba(22,35,42,.06)}
.kc:hover{border-color:var(--mint-200);box-shadow:var(--hover-sh)}
/* 캘린더 · 정기업무 */
.cal .d.today .dn span,.mgrid .c.today .dn span{background:var(--pri)}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--cyan)}
.ce.in{background:var(--pri-soft);border-left-color:var(--cyan)}
.ytbl tr.cur td.m{background:var(--pri-soft);color:var(--mint-700)}
.ym.cur{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;box-shadow:var(--hover-sh)}
.yd{background:var(--pri-soft);color:var(--mint-700)}
.mchip .md{background:var(--mint-100);color:var(--mint-700)}
.agd.today b,.agd.today span{color:var(--pri)}
.lg-dot{color:#0D99FF}
.lgh.today button{color:var(--pri)}
.tbl input[type=checkbox]{accent-color:var(--pri)}
.tbl tr.sel td{background:var(--pri-soft)}
.toast button{color:#7CF5FF}
.bulk{background:#333}
/* 홈 카드 제목: 카드마다 다른 그라데이션 배지 + 흰 아이콘 (다다 아이콘처럼 말랑하게) */
.hct{gap:12px}
.hct .htx{font-size:20px;font-weight:700;letter-spacing:-.5px;color:var(--ink)}
.hi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;position:relative;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 0 10px rgba(255,255,255,.22),0 0 16px var(--hs,rgba(13,153,255,.28))}
/* 정면에서 비추는 빛: 가운데가 살짝 밝고, 그림자는 사방으로 고르게 */
.hi::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.30) 0%,rgba(255,255,255,.08) 45%,rgba(255,255,255,0) 70%);pointer-events:none}
.hi svg{position:relative;z-index:1;stroke-width:2.1}
.hct .hi svg{color:#fff}.hct .arr svg{color:inherit}
.hi-sug{background:linear-gradient(135deg,#4CF1FF 0%,#0D99FF 52%,#B694FF 100%);--hs:rgba(13,153,255,.32)}
.hi-apps{background:linear-gradient(135deg,#5D88FF,#237FFF);--hs:rgba(35,127,255,.3)}
.hi-stat{background:linear-gradient(135deg,#43D6E8,#00A1B9);--hs:rgba(0,161,185,.3)}
.hi-rt{background:linear-gradient(135deg,#6FB6FF,#2E7BF6);--hs:rgba(46,123,246,.3)}
.hi-ppl{background:linear-gradient(135deg,#5BD69A,#16A34A);--hs:rgba(22,163,74,.28)}
.hi-week{background:linear-gradient(135deg,#7CF5FF,#00A1B9);--hs:rgba(0,161,185,.28)}
.hi-news{background:linear-gradient(135deg,#FFD166,#F59E0B);--hs:rgba(245,158,11,.3)}
.hct .arr{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(22,35,42,.08);transition:transform .15s,background .15s,color .15s}
.hct.lnk:hover .arr{transform:translateX(3px);background:#333;color:#fff}
.hc .card-d{margin-left:50px;margin-top:-10px}
/* ---------- 또렷하게 다듬기: 번지는 그림자 대신 1px 선 + 짧은 빛 ---------- */
.hi{box-shadow:inset 0 0 0 1px rgba(255,255,255,.38),0 0 0 1px rgba(16,35,42,.07),0 0 8px var(--hs,rgba(13,153,255,.22))}
.hi::after{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.24) 0%,rgba(255,255,255,0) 55%)}
.hi svg{stroke-width:2.3}
.hi-sug{--hs:rgba(13,153,255,.24)}.hi-apps{--hs:rgba(35,127,255,.22)}.hi-stat{--hs:rgba(0,161,185,.22)}.hi-rt{--hs:rgba(46,123,246,.22)}.hi-ppl{--hs:rgba(22,163,74,.2)}.hi-week{--hs:rgba(0,161,185,.2)}.hi-news{--hs:rgba(245,158,11,.22)}
.logo .mk{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 0 0 1px rgba(13,153,255,.14),0 0 8px rgba(13,153,255,.22)}
/* 로고: 보드 마크 + 'HR 업무 보드' 글자 + 이름 칩 */
.logo{gap:11px;align-items:center}
.logo .mk{width:38px;height:38px;border-radius:12px;position:relative;overflow:hidden}
.logo .mk::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)}
.logo .mk svg{position:relative;z-index:1}
.logo .wm{display:inline-flex;align-items:baseline;gap:6px;line-height:1}
.logo .wm .gt{font-size:22px;font-weight:900;letter-spacing:-.5px}
.logo .wm .wt{font-size:19px;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
.logo .co{margin:0 0 0 2px;font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--mint-700);padding:3px 10px;border-radius:999px;border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;line-height:1.3}
.ai{box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 0 0 1px rgba(16,35,42,.05),0 0 6px rgba(16,40,60,.05)}
.hct .arr{box-shadow:none;border:1px solid #E4E9EB}
.hct.lnk:hover .arr{border-color:#333}
.panel{border:1px solid #E9EEF1;box-shadow:0 1px 2px rgba(22,35,42,.04),0 4px 14px rgba(22,35,42,.035)}
.app{border:1px solid #E9EEF1;box-shadow:0 1px 2px rgba(22,35,42,.04),0 4px 12px rgba(22,35,42,.035)}
.app:hover{border-color:var(--cyan);box-shadow:0 0 0 3px var(--pri-soft)}
.mini button{border:1px solid #E4E9EB}
.mini button:hover{border-color:var(--cyan);box-shadow:0 0 0 3px var(--pri-soft)}
.sg{border:1px solid #E9EEF1}
.sg.hot{border:1.5px solid transparent}
.sgi{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 1px rgba(16,35,42,.05)}
.kc{border:1px solid #E6EBEE;box-shadow:0 1px 2px rgba(22,35,42,.06)}
.kc:hover{border-color:var(--cyan);box-shadow:0 0 0 3px var(--pri-soft)}
.btn{border-color:#D5DADF}
/* 보드 카드: 완료 체크 · 메모 · 업무 추가 버튼 */
.ktt{display:flex;align-items:flex-start;gap:9px;padding-right:26px}
/* 카드 펼치기 (체크리스트) */
.kc{position:relative}.kc .ktt{padding-right:46px}
.kexp{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid transparent;background:none;color:var(--mute);display:grid;place-items:center;padding:0;transition:transform .15s,background .15s}
.kexp:hover{background:var(--field);border-color:#E4E9EB;color:var(--ink)}
.kc.open .kexp{transform:rotate(180deg);background:var(--pri-soft);color:var(--mint-700)}
.kchl{margin:10px 0 0 29px;padding-top:10px;border-top:1px dashed #E4E9EB;cursor:default}
.kchl .prog{margin:0 0 8px}
.kci{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.kci .ckc{width:18px;height:18px;font-size:10px}
.kci span{flex:1;min-width:0;word-break:keep-all}
.kci.done span{color:var(--mute);text-decoration:line-through}
.kcdel{border:0;background:none;color:var(--mute);font-size:12px;opacity:0;padding:0 2px}
.kci:hover .kcdel{opacity:.7}
.kchadd input{width:100%;margin-top:6px;border:1px solid transparent;background:var(--field);border-radius:8px;height:30px;padding:0 9px;font-size:12.5px;outline:none}
.kchadd input:focus{background:#fff;border-color:var(--cyan)}
/* 체크리스트 단계 날짜 · 다음 단계 */
.kcd{font-style:normal;font-size:11.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.kcd.late{color:var(--red);font-weight:700}
.ckl .kcd{margin-right:4px}
/* 왼쪽 메뉴 */
.side{padding:20px 14px 30px}
.nav-q{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border-radius:16px;background:#fff;border:1px solid #E9EEF1;box-shadow:0 1px 2px rgba(22,35,42,.04);transition:border-color .15s,box-shadow .15s}
.nav-q:hover{border-color:var(--cyan);box-shadow:0 0 0 3px var(--pri-soft)}
.nav-q .nqi{width:36px;height:36px;border-radius:11px}
.nav-q .nqt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.nav-q .nqt b{font-size:14.5px;font-weight:700;color:var(--ink)}
.nav-q .nqt small{font-size:12px;color:var(--mute);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-q .nqa{margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--mute);font-size:15px;transition:background .15s,color .15s}
.nav-q:hover .nqa{background:#333;color:#fff}
.nav-lb{margin:18px 10px 8px;font-size:11.5px;font-weight:700;color:#A3AEB4;letter-spacing:.6px}
.nav a{height:46px;padding:0 10px;gap:12px;border-radius:14px;font-size:15px;font-weight:500;color:#333;margin-bottom:2px}
.nav a .ni{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--field);color:#5F6E75;flex:none;transition:background .15s,color .15s,box-shadow .15s}
.nav a .ni svg{color:inherit}
.nav a:hover{background:var(--field)}
.nav a:hover .ni{background:#fff;color:var(--ink);box-shadow:0 0 0 1px #E4E9EB}
.nav a.on{background:var(--pri-soft);color:var(--mint-700);font-weight:700}
.nav a.on .ni{background:var(--grad);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.38),0 0 0 1px rgba(16,35,42,.06),0 0 8px rgba(13,153,255,.22)}
.nav a.on svg{color:#fff}
.nav a .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;font-size:11.5px;box-shadow:0 0 0 2px #fff}
/* 보드: 중요 칸 + 완료 아래 보류 */
.kstack{display:flex;flex-direction:column;gap:14px;min-width:0}
.kdot.s-star{background:#D4A64A}
.kcol.k-star{background:#EEF3F5}
.kcol.k-star.over{background:var(--pri-soft);border-color:var(--cyan)}
.kcol.k-hold .kl{max-height:30vh}
.kcol.k-done .kl{max-height:40vh}
.ktt .ckc{width:20px;height:20px;margin-top:1px;font-size:11px}
.ktt b{flex:1;min-width:0}
.kmemo{margin:6px 0 0 29px;font-size:12.5px;line-height:1.5;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.kc .kmeta,.kc .kfoot{margin-left:29px}
.kc .kbar{margin-left:29px}

function guessCat(t){
  if(/근태|근로자의 날/.test(t)) return '근태';
  if(/연차/.test(t)) return '연차';
  if(/교육/.test(t)) return '교육';
  if(/노사/.test(t)) return '노사';
  if(/고용현황|건강검진/.test(t)) return '기타';
  if(/4대보험|보험료|보수총액|국민연금|근로내용/.test(t)) return '4대보험';
  if(/원천세|지급명세서|연말정산/.test(t)) return '세무신고';
  if(/연봉|계약/.test(t)) return '계약·갱신';
  if(/급여|최저임금|퇴직연금/.test(t)) return '급여';
  return '기타';
}

/* =====================================================================
   데이터 연결 (이 PC 브라우저 저장소 + GitHub 동기화)
   - 모든 자료는 localStorage 한 칸(STORE_KEY)에 JSON으로 저장돼요.
   - 설정 > GitHub 연동을 켜면 비공개 저장소의 JSON 파일 하나(예: board.json)와 맞춰요.
     · 바꿀 때마다 몇 초 뒤 GitHub에 저장(커밋)하고, 창을 다시 볼 때·1분마다 GitHub 쪽 변경을 가져와요.
     · 두 PC에서 따로 고친 경우 항목(칸) 단위로 합치고, 같은 칸을 둘 다 고쳤으면 지금 PC 것을 남겨요.
   - 토큰은 이 PC 브라우저에만 보관하고 백업 파일·GitHub에는 넣지 않아요.
   ===================================================================== */
const GH_CFG=NS+'gh.cfg', GH_STATE=NS+'gh.state';
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,q)=>(o[q]=x[q],o),{}):x);
// 3방향 합치기: 지난 동기화(b) 대비 이 PC(l)에서 바뀐 건 l, 아니면 GitHub(r)
function merge3(b,l,r){
  const jb=canon(b),jl=canon(l),jr=canon(r);
  if(jl===jb)return r;
  if(jr===jb||jr===jl)return l;
  const isO=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(isO(b)&&isO(l)&&isO(r)){const o={};for(const k of new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)])){const v=merge3(b[k],l[k],r[k]);if(v!==undefined)o[k]=v}return o}
  return l;
}
const b64e=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0)));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ghRepoUrl=c=>`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
const ghFileUrl=c=>ghRepoUrl(c)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/');
const ghFetch=(c,url,opt={})=>fetch(url,{cache:'no-store',...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,...(opt.headers||{})}});
async function ghErr(r){
  let m='';try{m=(await r.json()).message||''}catch(e){}
  const e=new Error(r.status===401?'토큰이 맞지 않거나 만료됐어요':r.status===403?'권한이 없거나 GitHub 요청 한도를 넘었어요'+(m?' ('+m+')':''):r.status===404?'저장소를 찾지 못했어요 (저장소 이름과 토큰 권한을 확인해 주세요)':'GitHub 오류 '+r.status+(m?': '+m:''));
  e.status=r.status;return e;
}
async function ghGet(c){
  const u=ghFileUrl(c)+'?ref='+encodeURIComponent(c.branch);
  const r=await ghFetch(c,u);
  if(r.status===404)return null;
  if(!r.ok)throw await ghErr(r);
  const j=await r.json();
  let txt;
  if(j.encoding==='base64'&&j.content)txt=b64d(j.content);
  else{const r2=await ghFetch(c,u,{headers:{Accept:'application/vnd.github.raw+json'}});if(!r2.ok)throw await ghErr(r2);txt=await r2.text()}
  let o;try{o=JSON.parse(txt)}catch(e){throw new Error(c.path+' 파일이 보드 자료(JSON)가 아니에요')}
  return {sha:j.sha,data:o.data||{},savedAt:o.savedAt||''};
}
async function ghPut(c,data,sha){
  const body={message:'보드 저장 '+new Date().toLocaleString('ko-KR'),branch:c.branch,content:b64e(JSON.stringify({app:'HR 업무 보드',v:1,savedAt:nowISO(),data},null,1))};
  if(sha)body.sha=sha;
  const r=await ghFetch(c,ghFileUrl(c),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409||r.status===422){const e=new Error('GitHub 쪽 자료가 먼저 바뀌었어요');e.conflict=true;throw e}
  if(!r.ok)throw await ghErr(r);
  return (await r.json()).content.sha;
}
function localApi(){
  let S={};
  const subs={};
  // GitHub 동기화 상태
  const G={cfg:null,sha:null,base:null,at:null,timer:null,busy:false,again:false,applying:false,stat:'off',msg:'',seen:new Set()};
  const loadG=()=>{
    try{G.cfg=JSON.parse(localStorage.getItem(GH_CFG)||'null')}catch(e){G.cfg=null}
    try{const s=JSON.parse(localStorage.getItem(GH_STATE)||'null');G.sha=s?.sha||null;G.base=s?.base||null;G.at=s?.at||null}catch(e){}
    if(!G.cfg)G.stat='off';else if(G.stat==='off')G.stat='ok';
  };
  const persistG=()=>{try{localStorage.setItem(GH_STATE,JSON.stringify({sha:G.sha,base:G.base,at:G.at}))}catch(e){console.error(e)}};
  const setStat=(s,m='')=>{G.stat=s;G.msg=m;try{ghBadge()}catch(e){}};
  loadG();
  const load=()=>{
    S={};
    try{const raw=localStorage.getItem(STORE_KEY);const o=raw?JSON.parse(raw):{};for(const c in o)S[c]=new Map(Object.entries(o[c]||{}))}
    catch(e){console.error(e)}
  };
  const snapshot=()=>{const o={};for(const c in S)o[c]=Object.fromEntries(S[c]);return o};
  const save=()=>{
    // 변경 기록은 최근 500건만 보관
    const lg=S.logs;if(lg&&lg.size>500){[...lg].sort((a,b)=>(a[1].at||'').localeCompare(b[1].at||'')).slice(0,lg.size-500).forEach(([k])=>lg.delete(k))}
    try{localStorage.setItem(STORE_KEY,JSON.stringify(snapshot()))}
    catch(e){toast('브라우저 저장 공간이 가득 찼어요. 설정에서 백업을 내려받고 오래된 기록을 정리해 주세요.');throw e}
    if(!G.applying)ghLater();
  };
  const ghLater=()=>{if(!G.cfg||PREVIEW)return;clearTimeout(G.timer);if(!G.busy)setStat('wait');G.timer=setTimeout(()=>ghSync(),2500)};
  // GitHub에서 받은 자료로 이 PC 자료 바꾸기 (GitHub 저장은 다시 하지 않음)
  const applyData=d=>{
    S={};for(const c in d)S[c]=new Map(Object.entries(d[c]||{}));
    coll('meta').set('access',{emails:['me@local'],admins:[]});
    G.applying=true;try{save()}finally{G.applying=false}
    emitAll();
  };
  const ghSync=async()=>{
    const c=G.cfg;if(!c||PREVIEW)return;
    if(G.busy){G.again=true;return}
    clearTimeout(G.timer);G.busy=true;setStat('busy');
    try{
      for(let i=0;;i++){
        const rem=await ghGet(c);
        const local=snapshot();
        // GitHub이 우리가 마지막으로 저장한 판 그대로면(또는 예전에 본 판이 늦게 보이면) 이 PC 것만 반영
        const fresh=rem&&rem.sha!==G.sha&&!G.seen.has(rem.sha);
        if(!fresh&&rem&&G.base&&canon(local)===canon(G.base))break; // 양쪽 다 바뀐 것 없음
        const merged=fresh?merge3(G.base||{},local,rem.data):local;
        if(canon(merged)!==canon(local))applyData(merged);
        if(rem&&canon(merged)===canon(rem.data)){G.sha=rem.sha;G.base=merged;break}
        try{const sha=await ghPut(c,merged,rem?.sha);if(G.sha)G.seen.add(G.sha);if(rem?.sha)G.seen.add(rem.sha);G.sha=sha;G.base=merged;break}
        catch(e){if(e.conflict&&i<3){await sleep(1000*(i+1));continue}throw e}
      }
      G.at=nowISO();persistG();setStat('ok');
    }catch(e){console.error(e);setStat(navigator.onLine===false?'offline':'err',e.message||String(e))}
    finally{G.busy=false;if(G.again){G.again=false;setTimeout(()=>ghSync(),300)}}
  };
  const coll=c=>(S[c]??=new Map());
  const emit=c=>(subs[c]||[]).forEach(f=>f());
  const emitAll=()=>Object.keys(subs).forEach(emit);
  const merge=(c,id,d)=>coll(c).set(id,{...(coll(c).get(id)||{}),...structuredClone(d)});
  load();
  // 다른 창에서 바뀐 내용 반영
  window.addEventListener('storage',e=>{if(e.key===STORE_KEY){load();emitAll()}if(e.key===GH_CFG||e.key===GH_STATE){loadG();setStat(G.stat)}});
  // GitHub 쪽 변경 가져오기: 시작할 때, 창으로 돌아올 때, 1분마다 (입력 중일 땐 건너뜀)
  const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='q'};
  setTimeout(()=>{if(G.cfg)ghSync()},300);
  window.addEventListener('focus',()=>{if(G.cfg&&!typing())ghSync()});
  window.addEventListener('online',()=>{if(G.cfg)ghSync()});

    pv:{
      empty:()=>{try{return !localStorage.getItem(STORE_KEY)}catch(e){return true}},

      load:async()=>{

        c.branch=c.branch||j.default_branch||'main';
        return await ghGet(c);
      },
      // mode: 'remote' = GitHub 자료 가져오기, 'local' = 이 PC 자료로 GitHub 덮어쓰기
      connect:async(c,mode,rem)=>{
        G.cfg={owner:c.owner,repo:c.repo,branch:c.branch,path:c.path,token:c.token};

let genTimer=null;
function maybeGen(){clearTimeout(genTimer);genTimer=setTimeout(genTasks,600)}
function occurrences(r){
  const t=today(), d0=pD(t), out=[];
  const dayOf=(y,m,d)=>ymd(new Date(y,m-1,d==='last'?lastDay(y,m):Math.min(+d,lastDay(y,m))));
  const push=(key,y,m,sm,sd,sy)=>{const due=shiftDay(dayOf(y,m,r.day),r.shift);const start=sd?dayOf(sy||y,sm||m,sd):'';out.push({key,due,start:start&&start<=due?start:''})};
  if(r.freq==='yearly'){for(const y of [d0.getFullYear()-1,d0.getFullYear(),d0.getFullYear()+1]) push(String(y),y,+r.month,r.sM?+r.sM:+r.month,r.sD,y);}
  else{
    for(let k=-1;k<=3;k++){const dt=new Date(d0.getFullYear(),d0.getMonth()+k,1);const y=dt.getFullYear(),m=dt.getMonth()+1;
      if(r.freq==='quarterly'&&!(r.months||[3,6,9,12]).includes(m))continue;
      push(y+pad(m),y,m,m,r.sD,y);}
  }
  return out;
}
async function genTasks(){
  if(st.genBusy||!st.settings||!st.ready.tasks||!st.ready.routines)return;
  st.genBusy=true;
  const t=today(), from=S().genFrom||t, made=[];
  try{
    for(const r of st.routines.values()){
      if(r.active===false)continue;
      const lead=+r.lead||S().lead||14;
      for(const o of occurrences(r)){
        const id='r-'+r.id+'-'+o.key;
        if(st.tasks.has(id))continue;
        if(o.due<from||diffD(o.due,t)>lead)continue;
        const d=routineTaskData(r,o);
        const ok=await st.api.createIfMissing('tasks',id,d);
        if(ok)made.push(id);
      }
    }
  }catch(e){console.error(e)}
  st.genBusy=false;
  if(made.length)console.log('generated',made.length);
}

async function addLog(text,n){try{await st.api.add('logs',{at:nowISO(),by:me(),text,n:n||0})}catch(e){}}
function rng(s,d){if(!d&&!s)return '없음';if(s&&s!==d)return md(s)+'~'+md(d);return md(d)}
function diffText(t,ch){
  const out=[];
  if('status' in ch&&ch.status!==t.status)out.push(`상태 ${SL[t.status]||'-'} → ${SL[ch.status]}`);
  if('owner' in ch&&ch.owner!==(t.owner||''))out.push(`담당 ${nm(t.owner)} → ${nm(ch.owner)}`);
  if('helpers' in ch&&JSON.stringify(ch.helpers||[])!==JSON.stringify(t.helpers||[]))out.push(`부담당 ${(ch.helpers||[]).map(nm).join(', ')||'없음'}`);
  if(('start' in ch||'due' in ch)){const s2='start' in ch?ch.start:t.start,d2='due' in ch?ch.due:t.due;if((s2||'')!==(t.start||'')||(d2||'')!==(t.due||''))out.push(`기간 ${rng(t.start,t.due)} → ${rng(s2,d2)}`)}
  if('title' in ch&&ch.title!==t.title)out.push('업무명 변경');
  if('cat' in ch&&ch.cat!==t.cat)out.push(`분류 ${t.cat||'-'} → ${ch.cat||'-'}`);
  if('side' in ch&&ch.side!==t.side)out.push(`구분 ${ch.side||'-'}`);
  
  if('star' in ch&&!!ch.star!==!!t.star)out.push(ch.star?'중요 표시':'중요 해제');
  if('memo' in ch&&(ch.memo||'')!==(t.memo||''))out.push('메모 수정');
  if('remind' in ch&&+ch.remind!==+t.remind)out.push(`미리 알림 D-${ch.remind}`);
  if('deleted' in ch&&!!ch.deleted!==!!t.deleted)out.push(ch.deleted?'삭제':'복구');
  return out;
}
async function updateTasks(ids,chf,label,opt={}){
  const ops=[],undo=[];
  for(const id of ids){
    const t=st.tasks.get(id); if(!t)continue;
    const ch=typeof chf==='function'?chf(t):{...chf};
    if(!ch)continue;
    const dt=diffText(t,ch); if(!dt.length)continue;
    const before={};Object.keys(ch).forEach(k=>before[k]=t[k]??(k==='helpers'?[]:(k==='star'||k==='deleted'?false:'')));
    before.doneAt=t.doneAt||null;before.doneBy=t.doneBy||null;before.hist=t.hist||[];
    const d={...ch,updatedAt:nowISO(),updatedBy:me(),hist:[...dt.map(x=>({at:nowISO(),by:me(),t:x})),...(t.hist||[])].slice(0,40)};
    if(ch.status==='done'&&t.status!=='done'){d.doneAt=today();d.doneBy=me()}
    if(ch.status&&ch.status!=='done'&&t.status==='done'){d.doneAt=null;d.doneBy=null}
    if(ch.status==='doing'&&!t.startedAt)d.startedAt=today(); // 착수일
    if(ch.due&&t.due&&ch.due>t.due){d.postponed=(t.postponed||0)+1;if(!t.firstDue)d.firstDue=t.due} // 미룬 횟수 · 처음 마감일
    ops.push({c:'tasks',id,d});undo.push({id,before});
  }
  if(!ops.length){if(!opt.quiet)toast('바뀐 내용이 없어요');return 0}
  try{await st.api.batch(ops)}catch(e){toast('저장하지 못했어요: '+e.message);return 0}
  const lbl=label||(ops.length>1?`${ops.length}건 수정`:'수정');
  const firstTitle=st.tasks.get(ops[0].id)?.title||'';
  addLog(ops.length>1?`${lbl} (${ops.length}건)`:`${firstTitle} · ${diffText(undo[0]?{...st.tasks.get(ops[0].id),...undo[0].before}:{},ops[0].d).join(', ')||lbl}`,ops.length);
  st.undo={label:lbl,items:undo};
  if(!opt.quiet)toast(lbl+(ops.length>1?` · ${ops.length}건`:''),true);
  return ops.length;
}
async function doUndo(){
  const u=st.undo;if(!u)return;st.undo=null;

}
async function createTask(d,quiet){
  const id='t-'+uid();

function parseQuick(s){
  const td=today(),y=+td.slice(0,4);let x=' '+s+' ',due='',start='',cat='',star=false,m;
  const take=re=>{const r=x.match(re);if(r)x=x.replace(r[0],' ');return r};
  const ymd2=(mo,d)=>{let yy=y;if(`${yy}-${pad(mo)}-${pad(d)}`<addD(td,-60))yy++;return `${yy}-${pad(mo)}-${pad(d)}`};
  if(m=take(/\s#(\S+)/))cat=m[1];
  if(take(/\s!(?=\s)/)||take(/\s중요(?=\s)/))star=true;
  if(m=take(/\s(\d{1,2})\/(\d{1,2})\s*~\s*(\d{1,2})\/(\d{1,2})(?=\s)/)){start=ymd2(+m[1],+m[2]);due=ymd2(+m[3],+m[4])}
  else if(m=take(/\s(\d{4})-(\d{1,2})-(\d{1,2})(?=\s)/))due=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  else if(m=take(/\s(\d{1,2})\/(\d{1,2})(?=\s)/))due=ymd2(+m[1],+m[2]);
  else if(m=take(/\s(\d{1,2})월\s*(\d{1,2})일(?=\s)/))due=ymd2(+m[1],+m[2]);
  else if(take(/\s오늘(?=\s)/))due=td;
  else if(take(/\s내일(?=\s)/))due=addD(td,1);
  else if(take(/\s모레(?=\s)/))due=addD(td,2);
  else if(take(/\s다음\s?주(?=\s)/))due=addD(weekStart(td),11);
  else if(take(/\s(이번\s?주|금요일)(?=\s)/))due=addD(weekStart(td),4);
  else if(take(/\s(월말|이번\s?달)(?=\s)/)){const d=pD(td);due=ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}
  return {title:x.replace(/\s+/g,' ').trim(),due,start,cat,star};
}

const CAL_KINDS=[['task','업무'],['event','일정'],['person','입·퇴사'],['iv','면접'],['track','수습·계약'],['talk','면담']];
function calF(){if(!st.calf){let v=null;try{v=JSON.parse(lsGet(NS+'calf')||'null')}catch(e){}st.calf={kinds:CAL_KINDS.map(k=>k[0]),star:false,side:'',cat:'',done:true,...(v||{})}}return st.calf}
const calSave=()=>lsSet(NS+'calf',JSON.stringify(st.calf));
const evOn=(e,d)=>e.end&&e.end>e.start?(e.start<=d&&e.end>=d&&diffD(e.end,e.start)<=62):e.start===d;
function calItems(d){
  const F=calF(),K=new Set(F.kinds),out=[];
  if(K.has('event'))[...(st.events?.values()||[])].filter(e=>evOn(e,d)&&(!F.star||e.star)).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(e=>out.push({k:'event',star:e.star,html:`<span class="ce ev" data-ev="${e.id}">${e.star?'★':''}${e.time?`<i class="tm">${esc(e.time)}</i>`:''}${esc(e.title)}</span>`,row:`<div class="cdr" data-ev="${e.id}"><span class="cdk k-ev">일정</span><div class="tt"><b>${e.star?'★ ':''}${esc(e.title)}</b><small>${[e.time,e.end&&e.end!==e.start?`${md(e.start)}~${md(e.end)}`:'',e.memo].filter(Boolean).map(esc).join(' · ')}</small></div></div>`}));
  if(K.has('task'))live().filter(x=>calOn(x,d)&&(F.done||x.status!=='done')&&(!F.star||x.star)&&(!F.side||x.side===F.side)&&(!F.cat||x.cat===F.cat)).sort((a,b)=>(b.star?1:0)-(a.star?1:0)||byDue(a,b)).forEach(x=>{const mid=x.start&&x.start!==x.due&&d!==x.start&&d!==x.due;
    out.push({k:'task',star:x.star,html:`<span class="ce ${x.status==='done'?'done':''} ${isLate(x)?'late':''} ${mid?'mid':''}" style="--c:${sideCol(x.side)}" data-open="${x.id}">${x.star?'★':''}${x.start&&x.start!==x.due&&d===x.start?'▸ ':''}${esc(x.title)}</span>`,row:rowHtml(x)})});
  if(F.star)return out;
  if(K.has('person'))[...st.people.values()].filter(p=>p.date===d).forEach(p=>out.push({k:'person',html:`<span class="ce ${p.type}" data-person="${p.id}">${p.type==='in'?'입사':'퇴사'} ${esc(p.name)}</span>`,row:`<div class="cdr" data-person="${p.id}"><span class="cdk k-${p.type}">${p.type==='in'?'입사':'퇴사'}</span><div class="tt"><b>${esc(p.name)}</b><small>${esc([p.team,p.rank].filter(Boolean).join(' · '))}</small></div></div>`}));
  if(K.has('iv'))cands().filter(c=>c.date===d&&ivRes(c)!=='불참').forEach(c=>out.push({k:'iv',html:`<span class="ce iv" data-cand="${c.id}">면접 ${esc(c.time||'')} ${esc(c.name)}</span>`,row:`<div class="cdr" data-cand="${c.id}"><span class="cdk k-iv">면접</span><div class="tt"><b>${esc(c.name)}</b><small>${esc([c.time,c.team,c.position].filter(Boolean).join(' · '))}</small></div></div>`}));
  if(K.has('track'))staffOn().forEach(s=>{const it=(lb)=>out.push({k:'track',html:`<span class="ce tk" data-staff="${s.id}">${lb} ${esc(s.name)}</span>`,row:`<div class="cdr" data-staff="${s.id}"><span class="cdk k-tk">${lb}</span><div class="tt"><b>${esc(s.name)}</b><small>${esc([s.team,s.rank].filter(Boolean).join(' · '))}</small></div></div>`});
    if(s.prob&&!s.probRes&&s.joinDate&&probEnd(s)===d)it('수습 종료');if(s.etype==='계약'&&!s.cDec&&s.cEnd===d)it('계약 만료')});
  if(K.has('talk'))[...st.talks.values()].filter(k=>k.date===d).forEach(k=>out.push({k:'talk',html:`<span class="ce tl" data-talk="${k.id}">면담 ${esc(k.name)}</span>`,row:`<div class="cdr" data-talk="${k.id}"><span class="cdk k-tl">면담</span><div class="tt"><b>${esc(k.name)}</b><small>${esc(k.kind||'')}</small></div></div>`}));
  return out;
}

    ${grp.length?grp.map(([l,L])=>`<div class="cdg"><div class="cdgh">${l}<span class="tc">${L.length}</span></div><div class="rows">${L.map(x=>x.row).join('')}</div></div>`).join(''):'<div class="empty">이날은 비어 있어요.<br><small>날짜 칸의 + 로 일정이나 업무를 넣을 수 있어요.</small></div>'}
  </aside></div>`;
}
/* 일정 (캘린더 전용) */
function openEvent(id,pre={}){
  const e=id?st.events?.get(id):{title:'',start:pre.d||today(),end:'',time:'',memo:'',star:false};if(!e)return;
  openLayer(`<div class="modal" role="dialog" aria-label="일정"><h2>${id?'일정':'일정 추가'}</h2><p class="note" style="margin:-8px 0 14px">캘린더에만 보이고 업무 목록·보드에는 나오지 않아요.</p>
   <form id="fEv" data-id="${id||''}">
    <div class="fld"><label for="eTitle">제목</label><input class="inp" id="eTitle" value="${esc(e.title)}" placeholder="예) 학교 교수 방문 (실습 면담)"></div>
    <div class="g3"><div class="fld"><label for="eStart">날짜</label><input class="inp" type="date" id="eStart" value="${e.start||''}"></div>
     <div class="fld"><label for="eEnd">끝나는 날 (여러 날일 때)</label><input class="inp" type="date" id="eEnd" value="${e.end||''}"></div>
     <div class="fld"><label for="eTime">시간</label><input class="inp" id="eTime" value="${esc(e.time||'')}" placeholder="예) 14:00"></div></div>
    <div class="fld"><label for="eMemo">메모</label><input class="inp" id="eMemo" value="${esc(e.memo||'')}"></div>
    <div class="fld"><label class="chkl"><input type="checkbox" id="eStar" ${e.star?'checked':''}> ★ 중요 일정</label></div>
   </form>
   <div class="acts">${id?`<button class="btn dan" data-act="delEvent" data-id="${id}" style="margin-right:auto">삭제</button><button class="btn" data-act="evToTask" data-id="${id}">업무로 바꾸기</button>`:''}<button class="btn" data-act="closeLayer">취소</button><button class="btn pri" data-act="saveEvent">${id?'저장':'추가'}</button></div></div>`);
  setTimeout(()=>{if(!id)$('#eTitle')?.focus()},30);
}
async function saveEvent(){
  const id=$('#fEv').dataset.id,d={title:$('#eTitle').value.trim(),start:$('#eStart').value,end:$('#eEnd').value,time:$('#eTime').value.trim(),memo:$('#eMemo').value,star:$('#eStar').checked,updatedAt:nowISO()};
  if(!d.title){toast('제목을 적어 주세요');$('#eTitle').focus();return}
  if(!d.start){toast('날짜를 정해 주세요');return}
  if(d.end&&d.end<d.start){toast('끝나는 날이 시작보다 빨라요');return}
  if(d.end===d.start)d.end='';
  await st.api.put('events',id||'e-'+uid(),id?d:{...d,createdAt:nowISO()});addLog(`일정 ${id?'수정':'등록'} · ${d.title}`);closeLayer();toast(id?'일정을 저장했어요':'캘린더에 일정을 넣었어요');
}/* 캘린더 표시: 정기업무·마감 업무는 마감일에만, 직접 만든 기간 업무(시작일~마감일)만 기간 내내 보여요 */
function calOn(x,d){if(!x.due)return false;if(x.rid||!x.start||x.start===x.due)return x.due===d;return x.start<=d&&x.due>=d&&diffD(x.due,x.start)<=45}
/* ---------------- 정기업무 ---------------- */
function rDue(r){
  if(r.freq==='yearly')return (r.sM&&r.sD?`${r.sM}/${r.sD}~`:'')+`${r.month}/${r.day==='last'?'말일':r.day}`;
  if(r.freq==='quarterly')return `분기 ${(r.months||[3,6,9,12]).join('·')}월 ${r.day==='last'?'말일':r.day+'일'}`;
  return `매월 ${r.sD?r.sD+'일~':''}${r.day==='last'?'말일':r.day+'일'}`;
}
function riHtml(r,showDue=true){return `<div class="ri ${r.active===false?'off':''}" data-rt="${r.id}" title="${esc(r.title+(r.memo?' · '+r.memo:''))}" style="--c:${sideCol(r.side)}"><span class="dot"></span><span class="rt">${esc(r.title)}${r.memo?` <span class="note">· ${esc(r.memo)}</span>`:''}</span>${showDue?`<span class="rd">${r.freq==='yearly'?(r.day==='last'?'말일':`~${r.month}/${r.day}`):''}</span>`:''}</div>`}
const isLegal=r=>/신고|납부|제출|지급명세서/.test(r.title);
// 그 달에 돌아오는 정기업무 + 만들어진 업무의 상태
function monthOcc(y,m){
  const ym=`${y}-${pad(m)}`,out=[];
  for(const r of st.routines.values()){if(r.active===false||(st.rside&&r.side!==st.rside))continue;
    for(const o of occurrences(r)){if(!o.due.startsWith(ym))continue;const t=st.tasks.get('r-'+r.id+'-'+o.key);out.push({r,o,t:t&&!t.deleted?t:null})}}
  return out.sort((a,b)=>(a.t?.due||a.o.due).localeCompare(b.t?.due||b.o.due)||a.r.title.localeCompare(b.r.title));
}
function occState(x){const td=today(),due=x.t?.due||x.o.due;
  if(x.t?.status==='done')return ['done','완료'];
  if(x.t){if(due<td)return ['late',`${-diffD(due,td)}일 지남`];if(x.t.status==='doing')return ['doing','진행중'];if(x.t.status==='hold')return ['hold','보류'];return ['todo',due===td?'오늘 마감':`D-${diffD(due,td)}`]}
  if(due<td)return ['miss','기록 없음'];return ['plan',`예정 · D-${diffD(due,td)}`]}
function occRow(x){const [k,l]=occState(x);
  return `<div class="oc ${k}">${x.t?`<button class="ckc ${k==='done'?'on':''}" data-act="toggleDone" data-id="${x.t.id}" aria-label="완료">${k==='done'?'✓':''}</button>`:'<span class="ckc ghost" title="아직 업무 목록에 없어요"></span>'}
   <div class="lt" ${x.t?`data-open="${x.t.id}"`:`data-rt="${x.r.id}"`}><b>${esc(x.r.title)}</b><div class="lm">${catChip(x.r.cat)}${isLegal(x.r)?'<span class="cc t-c">법정 기한</span>':''}${x.t?chkN(x.t):(x.r.chk?.length?`<span class="mm">☑ ${x.r.chk.length}단계</span>`:'')}${x.r.memo?`<span class="mm">${esc(x.r.memo)}</span>`:''}</div></div>
   <span class="ost s-${k}">${l}</span>
   ${!x.t&&k==='plan'?`<button class="btn sm" data-act="genOne" data-rid="${x.r.id}" data-key="${x.o.key}">지금 만들기</button>`:''}</div>`}
function agendaHtml(A){
  const days=[...new Set(A.map(x=>x.t?.due||x.o.due))],td=today();
  return days.map(d=>`<div class="ag"><div class="agd ${d===td?'today':''} ${isOff(d)?'off':''}"><b>${+d.slice(8)}</b><span>${d===td?'오늘':dow(d)}</span></div><div class="agl">${A.filter(x=>(x.t?.due||x.o.due)===d).map(occRow).join('')}</div></div>`).join('')||'<div class="empty">이 달에 돌아오는 정기업무가 없어요.</div>';
}
function yItem(r,m){return `<div class="yi ${r.active===false?'off':''}" data-rt="${r.id}"><span class="yd">${r.freq==='quarterly'?'분기':(+r.month!==m?r.month+'/':'')+(r.day==='last'?'말일':r.day+'일')}</span><span class="yt">${esc(r.title)}${isLegal(r)?' <span class="lg-dot" title="법정 기한">●</span>':''}</span></div>`}
function vRoutines(){
  const R=[...st.routines.values()].filter(r=>!st.rside||r.side===st.rside);
  const tabs=`<div class="segs"><button class="${st.rtab==='now'?'on':''}" data-act="rtab" data-v="now">이번 달</button><button class="${st.rtab==='year'?'on':''}" data-act="rtab" data-v="year">년간</button><button class="${st.rtab==='month'?'on':''}" data-act="rtab" data-v="month">매월 · 날짜별</button><button class="${st.rtab==='list'?'on':''}" data-act="rtab" data-v="list">전체 목록 · 일괄 수정</button></div>
   <div class="segs" style="margin-left:8px"><button class="${!st.rside?'on':''}" data-act="rside" data-v="">전체</button><button class="${st.rside==='인사'?'on':''}" data-act="rside" data-v="인사">인사</button><button class="${st.rside==='기타'?'on':''}" data-act="rside" data-v="기타">기타</button></div>`;
  let body='';
  const td=today(),curM=+td.slice(5,7),curY=+td.slice(0,4);
  if(st.rtab==='now'){
    const A=monthOcc(curY,curM),nx=new Date(curY,curM,1),B=monthOcc(nx.getFullYear(),nx.getMonth()+1);
    const cnt=k=>A.filter(x=>occState(x)[0]===k).length,done=cnt('done'),late=cnt('late');
    body=`<div class="rsum"><div><b>${curM}월 정기업무</b><span class="note">${A.length}건</span></div><div class="prog"><i style="width:${A.length?Math.round(done/A.length*100):0}%"></i></div>
      <div class="rchips"><span class="cc t-g">완료 ${done}</span>${late?`<span class="cc t-r">지남 ${late}</span>`:''}<span class="cc t-b">남음 ${A.length-done-late-cnt('miss')}</span></div></div>
     <div class="agenda">${agendaHtml(A)}</div>
     <div class="lgh"><button data-act="gfold" data-k="rnextOpen">${st.gfold?.rnextOpen?'▾':'▸'} 다음 달 · ${nx.getMonth()+1}월 미리 보기</button><span class="tc">${B.length}</span></div>
     ${st.gfold?.rnextOpen?`<div class="agenda dim">${agendaHtml(B)}</div>`:''}
     <p class="note" style="margin-top:14px">동그라미를 누르면 완료돼요. 점선 동그라미는 아직 업무 목록에 만들어지지 않은 것(마감 ${S().lead||14}일 전쯤 자동 생성)이에요. '지금 만들기'로 미리 꺼낼 수 있어요.</p>`;
  }else if(st.rtab==='year'){
    const Y=R.filter(r=>r.freq==='yearly'),Q=R.filter(r=>r.freq==='quarterly'),M=R.filter(r=>r.freq==='monthly');
    const dk=r=>(r.day==='last'?32:+r.day);
    body=`<div class="ygrid">${Array.from({length:12},(_,i)=>i+1).map(m=>{
      const items=Y.filter(r=>+(r.gm||r.month)===m).sort((a,b)=>(+a.month*40+dk(a))-(+b.month*40+dk(b)));
      return `<div class="ym ${m===curM?'cur':''} ${m<curM?'past':''}"><div class="ymh"><b>${m}월</b>${m===curM?'<span class="cc t-b">이번 달</span>':''}<span class="note">${items.length}</span><button class="addln" data-act="newRt" data-freq="yearly" data-m="${m}" aria-label="${m}월에 추가">+</button></div>${items.map(r=>yItem(r,m)).join('')||'<div class="note" style="padding:4px 2px">없음</div>'}</div>`}).join('')}</div>
     <div class="ymon"><div class="ymh"><b>매월 반복</b><span class="note">${M.length}</span><button class="addln" data-act="newRt" data-freq="monthly" aria-label="매월 업무 추가">+</button></div>
      <div class="mstrip">${M.sort((a,b)=>dk(a)-dk(b)).map(r=>`<button class="mchip ${r.active===false?'off':''}" data-rt="${r.id}"><span class="md">${r.day==='last'?'말일':r.day+'일'}</span>${esc(r.title)}${r.active===false?' (안 함)':''}</button>`).join('')}</div></div>
     ${Q.length?`<div class="ymon"><div class="ymh"><b>분기 · 반기 반복</b><span class="note">${Q.length}</span><button class="addln" data-act="newRt" data-freq="quarterly" aria-label="분기 업무 추가">+</button></div>
      <div class="mstrip">${Q.map(r=>`<button class="mchip ${r.active===false?'off':''}" data-rt="${r.id}"><span class="md">${(r.months||[3,6,9,12]).join('·')}월 ${r.day==='last'?'말일':r.day+'일'}</span>${esc(r.title)}${r.active===false?' (안 함)':''}</button>`).join('')}</div></div>`:''}
     <p class="note" style="margin-top:12px"><span class="lg-dot">●</span> 신고·납부·제출처럼 법정 기한이 있는 업무 · 지난 달은 흐리게, 이번 달은 그라데이션 테두리로 보여요.</p>`;
  }else if(st.rtab==='month'){
    const M=R.filter(r=>r.freq==='monthly');
    const dd=today().slice(8)*1;
    const days=[...new Set(M.map(r=>r.day==='last'?'last':+r.day))].sort((a,b)=>(a==='last'?99:a)-(b==='last'?99:b));
    body=`<div class="mtl">${days.map(d=>{const list=M.filter(r=>(r.day==='last'?'last':+r.day)===d).sort((a,b)=>(a.active===false)-(b.active===false)||a.title.localeCompare(b.title));
      return `<div class="mtr ${d===dd?'today':''} ${d==='last'?'lastd':''}"><div class="mtd">${d==='last'?'말일':d+'일'}</div><div class="mti">${list.map(r=>`<div class="mtc ${r.active===false?'off':''}" data-rt="${r.id}" style="--c:${sideCol(r.side)}" title="${esc(r.title+(r.memo?' · '+r.memo:''))}"><span class="dot"></span><span class="tx"><b>${r.star?'<i class="rstar">★</i>':''}${esc(r.title)}</b>${r.memo||r.active===false?`<small>${r.active===false?'사용 안 함 · ':''}${esc(r.memo||'')}</small>`:''}</span>${isLegal(r)?'<span class="lg">법정</span>':''}</div>`).join('')}</div></div>`}).join('')||'<div class="empty">매월 반복하는 정기업무가 없어요.</div>'}</div>
    <div class="mtnote"><button class="mtadd" data-act="newRt" data-freq="monthly">+ 매월 정기업무 추가</button></div>`;
  }else{
    const L=R.sort((a,b)=>(a.freq+a.side).localeCompare(b.freq+b.side)||String(a.month||0).padStart(2,'0').localeCompare(String(b.month||0).padStart(2,'0'))||(a.day==='last'?32:+a.day)-(b.day==='last'?32:+b.day));
    const all=L.length&&L.every(r=>st.rsel.has(r.id));
    body=`<table class="tbl"><thead><tr><th class="ck"><input type="checkbox" data-act="rckAll" ${all?'checked':''} aria-label="전체 선택"></th><th>업무</th><th>구분</th><th>주기</th><th>휴일이면</th><th>미리 만들기</th><th>사용</th></tr></thead><tbody>
    ${L.map(r=>`<tr class="${st.rsel.has(r.id)?'sel':''}"><td class="ck"><input type="checkbox" data-act="rck" data-id="${r.id}" ${st.rsel.has(r.id)?'checked':''} aria-label="선택"></td><td class="c-ttl"><div class="ttl" data-rt="${r.id}">${r.star?'<i class="rstar">★</i>':''}${esc(r.title)}</div><div class="sub">${catChip(r.cat)}${isLegal(r)?'<span class="cc t-c">법정 기한</span>':''}${r.chk?.length?`<span>☑ ${r.chk.length}단계</span>`:''}</div></td><td>${esc(r.side||'')}</td><td style="white-space:nowrap">${rDue(r)}</td><td style="white-space:nowrap">${{before:'앞당김',after:'미룸',none:'그대로'}[r.shift||'none']}</td><td>${r.lead||14}일 전</td><td>${r.active===false?'<span class="tag">안 함</span>':'<span class="tag" style="color:var(--green)">사용</span>'}</td></tr>`).join('')}</tbody></table>`;
  }
  return `<div class="ph"><h1>정기업무</h1><span class="sp"></span><button class="btn" data-act="genNow">지금 업무 만들기</button><button class="btn pri" data-act="newRt" data-freq="monthly">+ 정기업무 추가</button>
   <div class="desc">정기업무는 마감 ${S().lead||14}일 전쯤(업무마다 설정) 업무 목록에 자동으로 만들어져요. 마감일이 주말·공휴일이면 앞당기거나 미뤄요. 정기업무에 체크리스트를 넣어 두면 만들어지는 업무에 그대로 들어가요.</div></div>
   <section class="card"><div class="fbar">${tabs}</div>${body}</section>`;
}

/* ---------------- 기록 ---------------- */
function vHistory(){
  const D=live().filter(x=>x.status==='done').sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const del=[...st.tasks.values()].filter(x=>x.deleted);
  let body='';
  if(st.hTab==='done') body=`<div class="rows">${D.length?D.slice(0,150).map(t=>{const late=t.due&&t.doneAt&&t.doneAt>t.due;return `<div class="row" data-open="${t.id}"><div class="tt"><b>${esc(t.title)}</b><small>기한 ${md(t.due)||'없음'}</small></div><span class="dd">${md(t.doneAt)} 완료</span>${t.due?`<span class="pill ${late?'s-hold':'s-done'}">${late?diffD(t.doneAt,t.due)+'일 늦음':'기한 내'}</span>`:''}</div>`}).join(''):'<div class="empty">완료한 업무가 없어요.</div>'}</div>`;
  else if(st.hTab==='log') body=`<div class="hist">${st.logs.length?st.logs.map(l=>`<div class="h1"><time>${fmtAt(l.at)}</time><span>${esc(l.text)}</span></div>`).join(''):'<div class="empty">변경 기록이 없어요.</div>'}</div>`;
  else body=`<div class="rows">${del.length?del.map(t=>`<div class="row"><div class="tt"><b>${esc(t.title)}</b><small>삭제 · ${fmtAt(t.updatedAt)}</small></div><button class="btn sm" data-act="restore" data-id="${t.id}">복구</button></div>`).join(''):'<div class="empty">삭제한 업무가 없어요.</div>'}</div>`;
  return `<div class="ph"><h1>기록</h1></div><section class="card"><div class="fbar"><div class="segs"><button class="${st.hTab==='done'?'on':''}" data-act="hTab" data-v="done">완료한 업무</button><button class="${st.hTab==='log'?'on':''}" data-act="hTab" data-v="log">변경 기록</button><button class="${st.hTab==='trash'?'on':''}" data-act="hTab" data-v="trash">삭제한 업무</button></div></div>${body}</section>`;
}

/* ---------------- 설정 ---------------- */
function vSettings(){
  const s=S();
  const tplTxt=k=>(s.tpl?.[k]||TPL[k]).map(x=>`${x.t} | ${x.o==='M15'?'다음달15':(x.o>=0?'+':'')+x.o} | ${x.c||''}`).join('\n');

   <div class="kv"><b>업무 분류</b><div class="list-edit">${(s.cats||CATS).map(c=>`<span class="chip">${esc(c)}<button data-act="delCat" data-v="${esc(c)}" aria-label="삭제">✕</button></span>`).join('')}<form id="fCat" style="display:inline-flex;gap:6px"><input class="fsearch" style="min-width:120px" id="newCat" placeholder="새 분류"><button class="btn sm">추가</button></form></div>
   <b>정기업무 기본 미리 만들기</b><div><input class="fsel" type="number" min="1" max="90" id="sLead" value="${s.lead||14}" style="width:80px"> 일 전</div></div>

const GH_SL={ok:'GitHub 동기화됨',wait:'GitHub 저장 대기',busy:'GitHub 맞추는 중…',err:'GitHub 동기화 오류',offline:'오프라인 · 이 PC에 저장됨'};
function ghStatText(){
  const i=st.api?.gh?.info();if(!i||!i.cfg)return '';
  return GH_SL[i.stat]+(i.stat==='ok'&&i.at?' · '+fmtAt(i.at):'');
}
function ghBadge(){
  const i=st.api?.gh?.info();const b=$('#ghBadge');if(!b)return;
  if(!i||!i.cfg){b.hidden=true}else{b.hidden=false;b.className='ghb '+i.stat;b.textContent=ghStatText();b.title=i.stat==='err'?i.msg:'눌러서 지금 맞추기'}
  const s=$('#ghStat');if(s&&i?.cfg){s.textContent=ghStatText();s.title=i.msg||''}
  const m=$('#ghMsg');if(m&&i?.cfg){m.textContent=i.stat==='err'?i.msg:'';m.hidden=i.stat!=='err'}
}
function vGithub(){
  const i=st.api.gh.info();
  if(i.cfg){
    const c=i.cfg;
    return `<section class="card"><div class="card-h"><h2>GitHub 연동</h2><span class="sp"></span><span class="note" id="ghStat">${esc(ghStatText())}</span></div>
     <div class="kv"><b>저장소</b><div>${esc(c.owner+'/'+c.repo)} <span class="note">(${esc(c.branch)} 브랜치)</span></div><b>파일</b><div>${esc(c.path)}</div></div>
     <p class="note" id="ghMsg" style="color:#c4232a;margin:12px 0 0" ${i.stat==='err'?'':'hidden'}>${esc(i.stat==='err'?i.msg:'')}</p>
     <p class="note" style="margin:12px 0 14px">바꾼 내용은 몇 초 뒤 GitHub에 저장되고, 다른 PC에서 바꾼 내용은 창으로 돌아올 때·1분마다 가져와요. 인터넷이 끊겨도 이 PC에는 저장되고, 다시 연결되면 맞춰요.</p>
     <button class="btn pri" data-act="ghNow">지금 맞추기</button> <button class="btn" data-act="ghOff">연결 끊기</button>
    </section>`;
  }
  return `<section class="card"><div class="card-h"><h2>GitHub 연동</h2><span class="sp"></span><span class="note">꺼짐 · 이 PC에만 저장</span></div>
   <p class="note" style="margin:0 0 14px">GitHub <b>비공개 저장소</b>에 자료를 JSON 파일 하나로 저장해서 집·회사 PC 어디서든 같은 보드를 쓸 수 있어요. 고칠 때마다 저장 기록(커밋)이 남아 예전 상태도 찾아볼 수 있어요.</p>
   <form id="fGh">
    <div class="g2"><div class="fld"><label for="ghRepo">저장소 (사용자명/저장소이름)</label><input class="inp" id="ghRepo" placeholder="예: myname/hr-board-data" autocomplete="off" spellcheck="false"></div>
    <div class="fld"><label for="ghPath">저장할 파일 이름</label><input class="inp" id="ghPath" value="board.json" autocomplete="off" spellcheck="false"></div></div>
    <div class="fld"><label for="ghTok">토큰 (Fine-grained personal access token)</label><input class="inp" type="password" id="ghTok" placeholder="github_pat_로 시작하는 값" autocomplete="off" spellcheck="false"></div>
    <button class="btn pri">연결하기</button>
   </form>
   <details style="margin-top:14px"><summary class="note" style="cursor:pointer">토큰 만드는 법</summary>
    <ol class="note" style="margin:10px 0 0;padding-left:20px;line-height:1.9">
     <li>GitHub에서 <b>New repository</b> → 이름(예: hr-board-data) 입력 → <b>Private</b> 선택 → 만들기</li>
     <li>오른쪽 위 프로필 → <b>Settings</b> → 맨 아래 <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b></li>
     <li>Expiration(만료일)을 정하고, Repository access는 <b>Only select repositories</b> → 방금 만든 저장소 하나만 선택</li>
     <li>Permissions → Repository permissions → <b>Contents</b>를 <b>Read and write</b>로 → Generate token</li>
     <li>나온 토큰을 위 칸에 붙여넣고 연결하기. 만료되면 새 토큰으로 다시 연결하면 돼요.</li>
    </ol>
    <p class="note" style="margin:8px 0 0">토큰은 이 PC 브라우저에만 보관돼요. 백업 파일이나 GitHub에는 들어가지 않아요. 공용 PC에서는 다 쓰고 '연결 끊기'를 눌러 주세요.</p>
   </details>
  </section>`;
}
async function ghConnectForm(){
  const rp=$('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const [owner,repo]=rp.split('/');
  const path=($('#ghPath').value.trim()||'board.json').replace(/^\/+/,'');
  const token=$('#ghTok').value.trim();
  if(!owner||!repo){toast('저장소를 사용자명/저장소이름 형태로 적어 주세요');return}
  if(!token){toast('토큰을 붙여넣어 주세요');return}
  const c={owner,repo,path,token,branch:''};
  const btn=$('#fGh button');btn.disabled=true;btn.textContent='확인 중…';
  let rem;
  try{rem=await st.api.gh.check(c)}
  catch(e){btn.disabled=false;btn.textContent='연결하기';toast('연결하지 못했어요: '+e.message);return}
  const go=async mode=>{
    closeLayer();toast('GitHub과 맞추는 중…');
    try{await st.api.gh.connect(c,mode,rem);toast(mode==='remote'?'GitHub 자료를 가져왔어요':'GitHub에 저장했어요');render()}
    catch(e){toast('저장하지 못했어요: '+e.message);render()}
  };
  if(!rem){await go('local');return}
  const n=Object.keys(rem.data.tasks||{}).length;
  openLayer(`<div class="modal" role="alertdialog"><h2>GitHub에 이미 자료가 있어요</h2>
   <p>${esc(c.path)} (업무 ${n}건${rem.savedAt?', '+esc(fmtAt(rem.savedAt))+' 저장':''})이 있어요. 어느 쪽 자료로 시작할까요?</p>
   <p class="note">다른 PC에서 쓰던 보드를 이어 쓰려면 <b>GitHub 자료 가져오기</b>를 고르세요. 이 PC 자료는 사라지니 필요하면 먼저 백업 파일을 받아 두세요.</p>
   <div class="acts"><button class="btn" data-act="closeLayer">취소</button><button class="btn" id="ghLocal">이 PC 자료로 덮어쓰기</button><button class="btn pri" id="ghRemote">GitHub 자료 가져오기</button></div></div>`);
  btn.disabled=false;btn.textContent='연결하기';
  $('#ghRemote').onclick=()=>go('remote');
  $('#ghLocal').onclick=()=>go('local');
}

function readTaskForm(){
  return {title:$('#tTitle').value.trim(),status:$('#tStatus .on')?.dataset.v||'todo',owner:me(),helpers:[],start:$('#tStart').value,due:$('#tDue').value,side:$('#tSide').value,cat:$('#tCat').value,remind:+$('#tRemind').value,star:$('#tStar').checked,snz:$('#tSnz')?.value||'',memo:$('#tMemo').value};
}
async function saveTaskForm(){
  const id=$('#fTask').dataset.id,d=readTaskForm();
  if(!d.title){$('#tTitle').focus();toast('업무명을 적어주세요');return}
  if(d.start&&d.due&&d.start>d.due){toast('시작일이 마감일보다 늦어요');return}
  if(d.start&&!d.due)d.due=d.start;
  if(!id&&$('#fTask').classList.contains('mode-ev')){const s=d.start||d.due||today();await st.api.put('events','e-'+uid(),{title:d.title,start:s,end:d.start&&d.due&&d.due!==d.start?d.due:'',time:($('#tTime')?.value||'').trim(),memo:d.memo,star:d.star,createdAt:nowISO()});addLog(`일정 등록 · ${d.title}`);closeLayer();toast('캘린더에 일정을 넣었어요');return}
  if(id)await updateTasks([id],d,'업무 수정');else await createTask({...d,src:'직접 등록',chk:st.draftChk||[],...(d.status==='done'?{doneAt:today()}:{})});
  closeLayer();
}

function groupRows(F,key,order){

    return {label:esc(k),plain:k,n:L.length,cells:[pct(d.length,L.length),pct(dd.filter(x=>x.onTime).length,dd.length),L.filter(x=>x.late).length||'–']}});

    ${tRows.length?`<table class="btab"><thead><tr><th>부서</th><th class="bcol">면접 수</th><th class="num">합격</th><th class="num">불합격</th><th class="num">합격률</th><th class="num">입사</th><th class="num">퇴사</th></tr></thead><tbody>${tRows.map(x=>`<tr><td class="bl">${esc(x.t)}</td><td class="bcol"><div class="bw" title="${esc(x.t)} · 면접 ${x.iv}건"><div class="bt"><i style="width:${Math.max(2,Math.round(x.iv/mx*100))}%"></i></div><b>${x.iv}</b></div></td><td class="num">${x.o}</td><td class="num">${x.n}</td><td class="num">${x.rate}</td><td class="num">${x.hin}</td><td class="num">${x.hout}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">이 기간에 기록이 없어요.</div>'}</section>

function vHrSum(){
  const td=pD(today()),mo=k=>{const d=new Date(td.getFullYear(),td.getMonth()+k,1);return {ym:ymd(d).slice(0,7),m:d.getMonth()+1,y:d.getFullYear()}};

     sub:L=>{const o=L.filter(c=>ivRes(c)==='합격').length,n=L.filter(c=>ivRes(c)==='불합격').length;return `합격 ${o} · 불합격 ${n}`},tag:c=>ivRes(c)},

function orgTree(on,teams,divOf,rk){

  while(rest.length>1&&chain.length<2&&rk(rest[0])>rk(rest[1])){chain.push(rest.shift())}
  if(rest.length===1&&chain.length<2){chain.push(rest.shift())}

  const divCol=d=>{const ts=teams.filter(t=>divOf(t)===d),fs=[...new Set(ts.map(fam))],cnt=on.filter(s=>ts.includes(teamOf(s))).length;
    const body=fs.map(f=>{const sub=ts.filter(t=>fam(t)===f);if(sub.length===1)return `<div class="ot-f solo">${teamBox(sub[0])}</div>`;
      const c=on.filter(s=>sub.includes(teamOf(s))).length;return `<div class="ot-f"><div class="ot-fh"><b>${esc(f.replace(/팀$/,''))}</b><span class="tc">${c}</span><small>${sub.length}개 팀</small></div>${sub.map(teamBox).join('')}</div>`}).join('');
    return `<li style="flex:${Math.max(1,fs.length)} 1 0"><div class="ot-n div"><b>${esc(d||'사업부 미정')}</b><small>${cnt}명 · ${ts.length}개 부서</small></div><div class="ot-fs">${body}</div></li>`};
  const lvl=(arr,inner)=>arr.length?`<ul><li>${arr[0]}${lvl(arr.slice(1),inner)}</li></ul>`:inner;
  const nodes=chain.map(s=>`<div class="ot-n top">${pc(s)}</div>`);

async function staffPasteGo(){
  const rows=$('#spTxt').value.split(/\r?\n/).map(l=>l.split('\t').map(x=>x.trim())).filter(c=>c[0]);
  if(!rows.length){toast('붙여넣은 내용이 없어요');return}
  const ops=[],td=today();
  const replace=$('#spReplace')?.checked,all=staffAll(),used=new Set();
  /* 같은 사람 찾기: 사번 → 이름+부서 → 이름이 하나뿐일 때 이름 (한 번 짝지은 기록은 다시 안 씀) */
  const findEx=c=>{const free=all.filter(s=>!used.has(s.id));return (c[12]&&free.find(s=>s.empNo===c[12]))||free.find(s=>s.name===c[0]&&(s.team||'')===(c[1]||''))||(replace?(x=>x.length===1?x[0]:null)(free.filter(s=>s.name===c[0]&&!s.empNo)):null)};
  rows.sort((a,b)=>(a[7]==='퇴사')-(b[7]==='퇴사'));
  rows.forEach(c=>{const joinDate=parseDateLoose(c[5]),et=ETYPES.includes(c[4])?c[4]:(/계약/.test(c[4]||'')?'계약':'정규'),ex=findEx(c);if(ex)used.add(ex.id);
    let status=['재직','휴직','퇴사'].includes(c[7])?c[7]:(ex?.status||'재직');if(status==='재직'&&ex?.status==='휴직')status='휴직';
    const d={name:c[0],team:c[1]||'',rank:c[2]||'',job:c[3]||'',etype:et,joinDate,cEnd:parseDateLoose(c[6]),status,prob:/^[YN]$/i.test(c[10]||'')?/y/i.test(c[10]):(ex&&ex.joinDate===joinDate?!!ex.prob:(joinDate?diffD(td,joinDate)<92:false)),updatedAt:nowISO()};
    if(c[8])d.div=c[8];if(c[9]!=null&&c[9]!=='')d.leader=/^(y|o|팀장|1)$/i.test(c[9]);if(c[11])d.leaveDate=parseDateLoose(c[11]);if(c[12])d.empNo=c[12];if(c[13]!=null&&c[13]!==''&&!isNaN(+c[13]))d.tord=+c[13];
    ops.push({c:'staff',id:ex?.id||'s-'+uid(),d:ex?d:{...d,createdAt:nowISO()}})});
  const gone=replace?all.filter(s=>!used.has(s.id)):[];gone.forEach(s=>ops.push({c:'staff',id:s.id,del:true}));
  await st.api.batch(ops);addLog(`직원 명부 붙여넣기 ${rows.length}명${gone.length?` · 명단에 없던 ${gone.length}명 정리`:''}`,rows.length);closeLayer();toast(`${rows.length}명을 명부에 넣었어요${gone.length?` · 명단에 없던 ${gone.length}명은 지웠어요`:''}`);
}
